<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coordinate = signed area</title><style>body{margin:0;font:16px system-ui,Segoe UI,sans-serif;background:#f4f7fb;color:#17243a}main{max-width:1050px;margin:25px auto;padding:15px}h1{font-size:25px;margin:0 0 12px}.panel{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:20px;margin-top:15px}svg{width:100%;max-width:720px;height:auto;border-radius:8px;background:#fafcff;border:1px solid #dce5ef}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}button{background:#1f5e9e;border:none;color:white;padding:10px 16px;border-radius:9px;cursor:pointer}button:hover{background:#174779}label{display:inline-flex;gap:8px;align-items:center}input{width:155px}code,pre{background:#f0f4f8;border-radius:7px;padding:5px}#status{font-weight:600;color:#234f79}small{color:#536273}</style></head><body><main><h1>Coordinate = signed area</h1><p>Move the mystery vector and compare the two ordered parallelograms.</p><section class="panel"><svg id="plot" viewBox="0 0 680 450" role="img" aria-label="Interactive vector coordinate grid"></svg><p id="status" aria-live="polite"></p><div class="controls"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="step">Step →</button><button id="reset">↺ Reset</button></div><div class="controls"><label>x <input id="x" type="range" min="-4" max="4" step="1" value="3"><strong id="vx">3</strong></label><label>y <input id="y" type="range" min="-4" max="4" step="1" value="2"><strong id="vy">2</strong></label></div></section><section class="panel"><strong>Study tip:</strong> The blue and orange arrows are geometric vectors, the gold region is a signed parallelogram. Read the explanation above each stage; negative determinants mean reversed orientation.</section></main><script>const svg=document.getElementById('plot'),info=document.getElementById('status');let phase=0,timer=null;function S(tag,a,txt){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(a||{}).forEach(([k,v])=>e.setAttribute(k,v));if(txt!=null)e.textContent=txt;svg.appendChild(e);return e}function p(x,y){return [340+38*x,225-38*y]}function ln(a,b,color,width=2,dash=''){let [x1,y1]=p(...a),[x2,y2]=p(...b);S('line',{x1,y1,x2,y2,stroke:color,'stroke-width':width,'stroke-dasharray':dash})}function txt(x,y,label,color='#17243a'){let [px,py]=p(x,y);S('text',{x:px+7,y:py-8,fill:color,'font-size':15,'font-weight':600},label)}function vec(x,y,label,color){let [ex,ey]=p(x,y);S('line',{x1:340,y1:225,x2:ex,y2:ey,stroke:color,'stroke-width':4});let a=Math.atan2(ey-225,ex-340),r=13;S('polygon',{points:`${ex},${ey} ${ex-r*Math.cos(a-.4)},${ey-r*Math.sin(a-.4)} ${ex-r*Math.cos(a+.4)},${ey-r*Math.sin(a+.4)}`,fill:color});txt(x,y,label,color)}function grid(){svg.innerHTML='';for(let i=-8;i<=8;i++){ln([i,-5],[i,5],'#e6edf5',1);ln([-9,i],[9,i],'#e6edf5',1)}ln([-9,0],[9,0],'#8190a5',1.7);ln([0,-5],[0,5],'#8190a5',1.7)}function poly(u,v){let q=[[0,0],u,[u[0]+v[0],u[1]+v[1]],v].map(pt=>p(...pt).join(',')).join(' ');S('polygon',{points:q,fill:'#e7b455','fill-opacity':.25,stroke:'#c18b28','stroke-width':2})}function det(u,v){return u[0]*v[1]-u[1]*v[0]}function stop(){if(timer)clearInterval(timer);timer=null}document.getElementById('play').onclick=()=>{stop();timer=setInterval(()=>{phase=(phase+1)%steps;render()},1350)};document.getElementById('pause').onclick=stop;document.getElementById('reset').onclick=()=>{stop();phase=0;render()};document.getElementById('step').onclick=()=>{stop();phase=(phase+1)%steps;render()};
const steps=2;for(const k of ['x','y'])document.getElementById(k).oninput=()=>{document.getElementById('v'+k).textContent=document.getElementById(k).value;render()};function render(){let x=+document.getElementById('x').value,y=+document.getElementById('y').value;grid();if(phase===0){poly([1,0],[x,y]);vec(1,0,'i = (1,0)','#2775ae');vec(x,y,`v=(${x},${y})`,'#e07645');info.textContent=`Signed area det([i,v]) = 1 × ${y} − 0 × ${x} = y = ${y}`;}else{poly([x,y],[0,1]);vec(x,y,`v=(${x},${y})`,'#e07645');vec(0,1,'j = (0,1)','#2775ae');info.textContent=`Signed area det([v,j]) = ${x} × 1 − 0 × ${y} = x = ${x}`;}}render();</script></body></html>
