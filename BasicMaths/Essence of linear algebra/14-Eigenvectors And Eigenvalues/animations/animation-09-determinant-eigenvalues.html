<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finding eigenvalues with a determinant</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101923;color:#edf4fa;font:16px/1.55 Inter,system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:clamp(14px,4vw,44px)}
h1{font-size:clamp(28px,5vw,48px);line-height:1.1;margin:0;letter-spacing:-.04em}
h2{font-size:20px;margin:0 0 9px}p{margin:8px 0;color:#beccdb}
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:15px;margin-top:20px}
section{border:1px solid #3c5266;border-radius:14px;background:#192735;padding:15px}
canvas{display:block;width:100%;height:auto;background:#101923;border-radius:9px}
button{font:inherit;padding:7px 11px;color:#edf4fa;background:#273b4e;border:1px solid #637b90;border-radius:8px;cursor:pointer}
button[aria-pressed=true],#play{background:#ffda93;color:#172735;font-weight:700}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
input{width:100%;accent-color:#ffda93}
:focus-visible{outline:3px solid #ffda93;outline-offset:3px}
.matrix{display:inline-grid;grid-template-columns:repeat(2,minmax(2em,auto));text-align:center;gap:1px 9px;padding:0 6px;border-inline:2px solid;border-radius:4px;vertical-align:middle;font-variant-numeric:tabular-nums}
.math{font-size:clamp(16px,2.3vw,21px);color:#f2f6fb}
.gold{color:#ffda93}.mint{color:#8ee5ce}
.step{min-height:8.5em;border-top:1px solid #40566a;padding-top:12px}
#geometry{min-height:4.6em}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
</style>
<body><main>
<h1>Finding eigenvalues with a determinant</h1>
<p>Work through the algebra, then move λ to see exactly when the square flattens into a line.</p>
<div class="layout">
<section aria-label="Calculation">
<h2>The calculation</h2>
<div class="math">A = <span class="matrix"><span>2</span><span>2</span><span>1</span><span>3</span></span></div>
<div class="controls" role="group" aria-label="Calculation steps">
<button type="button" data-step="0" aria-pressed="true">1. Subtract λ</button>
<button type="button" data-step="1" aria-pressed="false">2. Take determinant</button>
<button type="button" data-step="2" aria-pressed="false">3. Expand</button>
<button type="button" data-step="3" aria-pressed="false">4. Solve</button>
</div>
<div class="step" id="step"></div>
<h2>With your current λ</h2>
<div class="math">A − λI = <span class="matrix"><span class="gold" id="d1">2</span><span>2</span><span>1</span><span class="gold" id="d2">3</span></span></div>
<p class="math" id="product"></p>
<p class="math mint" id="det"></p>
</section>
<section aria-label="Geometric view">
<h2>Watch A − λI transform the unit square</h2>
<canvas id="plot" width="570" height="430" role="img" aria-label="Coordinate grid showing the transformed square."></canvas>
<p>The dashed outline is the original unit square.</p>
<p id="geometry"></p>
<div class="controls">
<button type="button" id="play">Play λ sweep</button>
<button type="button" id="one">Set λ = 1</button>
<button type="button" id="four">Set λ = 4</button>
<button type="button" id="reset">Reset λ</button>
</div>
<label for="lambda">λ = <output id="value" for="lambda">0</output></label>
<input id="lambda" type="range" min="0" max="5" step=".01" value="0">
</section>
</div>
</main>
<script>
const steps = [
  '<h2>Subtract λ from the diagonal</h2><p class="math">A − λI = <span class="matrix"><span class="gold">2 − λ</span><span>2</span><span>1</span><span class="gold">3 − λ</span></span></p><p>The identity matrix I has ones on its diagonal and zeros everywhere else. The off-diagonal entries stay 2 and 1.</p>',
  '<h2>Multiply across the two diagonals</h2><p class="math">det = ad − bc<br>= <span class="gold">(2 − λ)(3 − λ)</span> − <span class="mint">(2)(1)</span></p><p>Multiply top-left by bottom-right, then subtract top-right times bottom-left.</p>',
  '<h2>Expand and combine like terms</h2><p class="math">(2 − λ)(3 − λ) − 2<br>= 6 − 2λ − 3λ + λ² − 2<br>= λ² − 5λ + 4</p>',
  '<h2>Set the determinant equal to zero</h2><p class="math">λ² − 5λ + 4 = (λ − 1)(λ − 4) = 0</p><p>One factor must be zero. The eigenvalues are <strong class="gold">λ = 1 and λ = 4</strong>. At each value, some nonzero vector v satisfies (A − λI)v = 0, which is the same as Av = λv.</p>'
];
const byId = id => document.getElementById(id);
const canvas = byId('plot');
const ctx = canvas.getContext('2d');
const slider = byId('lambda');
const play = byId('play');
const buttons = document.querySelectorAll('[data-step]');
const fmt = n => String(Number(n.toFixed(4))).replace('-', '−');
const screen = ([x,y]) => [260+49*x,252-49*y];
let lambda = 0;
let frame = null;

function path(points, stroke, width, fill) {
  ctx.beginPath();
  ctx.moveTo(...screen(points[0]));
  for (const point of points.slice(1)) ctx.lineTo(...screen(point));
  if (fill) {
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }
  ctx.strokeStyle = stroke;
  ctx.lineWidth = width;
  ctx.stroke();
}

function arrow(point,color) {
  path([[0,0],point],color,4);
  const angle = Math.atan2(point[1],point[0]);
  for (const offset of [-.5,.5]) {
    path([point,[point[0]-.27*Math.cos(angle+offset),point[1]-.27*Math.sin(angle+offset)]],color,3);
  }
}

function draw(value) {
  lambda = Math.round(value*100)/100;
  const a = 2-lambda;
  const d = 3-lambda;
  const det = a*d-2;
  const isRoot = lambda === 1 || lambda === 4;
  slider.value = lambda;
  byId('value').textContent = fmt(lambda);
  byId('d1').textContent = fmt(a);
  byId('d2').textContent = fmt(d);
  byId('product').textContent = 'det = ('+fmt(a)+')('+fmt(d)+') − (2)(1)';
  byId('det').textContent = 'det = '+fmt(det)+'  •  Area = '+fmt(Math.abs(det));
  const geometry = isRoot
    ? 'Eigenvalue found. The two column arrows lie on the same line, so the transformed square has zero area.'
    : 'The column arrows form a parallelogram with area '+fmt(Math.abs(det))+' square units.';
  byId('geometry').textContent = geometry;
  canvas.setAttribute('aria-label','Lambda '+fmt(lambda)+'. '+geometry);

  ctx.clearRect(0,0,570,430);
  ctx.font = '15px system-ui';
  ctx.fillStyle = '#a9bed0';
  for (let x=-4;x<=5;x++) {
    path([[x,-3.1],[x,4.5]],x===0?'#8199ad':'#304354',1);
    if (x!==0) ctx.fillText(fmt(x),screen([x,0])[0]-5,270);
  }
  for (let y=-3;y<=4;y++) {
    path([[-4.6,y],[5.5,y]],y===0?'#8199ad':'#304354',1);
    if (y!==0) ctx.fillText(fmt(y),233,screen([0,y])[1]+5);
  }
  const origin = [0,0];
  const col1 = [a,1];
  const col2 = [2,d];
  const corner = [a+2,1+d];
  path([origin,col1,corner,col2,origin],isRoot?'#ffe098':'#b899f0',isRoot?6:2,det<0?'#563e6c':'#353968');
  ctx.setLineDash([5,5]);
  path([origin,[1,0],[1,1],[0,1],origin],'#c3d0db',1.3);
  ctx.setLineDash([]);
  arrow(col1,'#ffda93');
  arrow(col2,'#8ee5ce');
}

function stop() {
  if (frame !== null) cancelAnimationFrame(frame);
  frame = null;
  play.textContent = 'Play λ sweep';
}
function seek(value) {
  stop();
  draw(value);
}
function selectStep(index) {
  buttons.forEach((button,i) => button.setAttribute('aria-pressed',String(i===index)));
  byId('step').innerHTML = steps[index];
}
buttons.forEach((button,index) => button.addEventListener('click',() => selectStep(index)));
slider.addEventListener('input',() => seek(Number(slider.value)));
byId('one').addEventListener('click',() => seek(1));
byId('four').addEventListener('click',() => seek(4));
byId('reset').addEventListener('click',() => seek(0));
play.addEventListener('click',() => {
  if (frame !== null) {
    stop();
    return;
  }
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    seek(lambda < 1 ? 1 : lambda < 4 ? 4 : 1);
    return;
  }
  draw(0);
  let start;
  play.textContent = 'Stop sweep';
  function animate(now) {
    start ??= now;
    const seconds = (now-start)/1000;
    // Pause at both exact roots so the collapse is easy to see.
    const value = seconds < 2 ? seconds/2 : seconds < 3 ? 1 :
      seconds < 9 ? 1+(seconds-3)/2 : seconds < 10 ? 4 : Math.min(5,4+(seconds-10)/2);
    draw(value);
    if (seconds >= 12) stop();
    else frame = requestAnimationFrame(animate);
  }
  frame = requestAnimationFrame(animate);
});
selectStep(0);
draw(0);
</script>
</body></html>
