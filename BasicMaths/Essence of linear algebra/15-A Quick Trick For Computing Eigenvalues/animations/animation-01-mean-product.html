<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mean and product: recover two eigenvalues</title><style>body{font:16px system-ui;background:#f5f7fa;color:#182332;max-width:900px;margin:24px auto;padding:16px}main{background:white;padding:22px;border-radius:16px;box-shadow:0 3px 15px #0001}canvas{width:100%;max-width:780px;height:320px;border:1px solid #d5dde7;border-radius:10px}button{padding:10px 15px;margin:6px 3px;background:#204d7a;color:white;border:0;border-radius:7px;cursor:pointer}input{width:160px}label{display:inline-block;margin:10px}#result{font-size:19px;line-height:1.7;background:#eef4fa;padding:12px;border-radius:8px}small{color:#576578}</style></head><body><main><h1>Mean and product: recover two eigenvalues</h1><p>Move the mean and product to see the eigenvalues emerge.</p><div id="sliders"></div><canvas id="plot" width="780" height="320"></canvas><p id="result"></p><button id="play">Play</button><button id="pause">Pause</button><button id="step">Step</button><button id="reset">Reset</button><p><small>Works offline. Use the sliders to explore the calculation; Step advances the highlighted explanation.</small></p></main><script>
const mode=1;const cvs=document.getElementById('plot'),ctx=cvs.getContext('2d'),result=document.getElementById('result'),wrap=document.getElementById('sliders');let phase=0,timer=null;
const defs=mode===1?[['Mean m',7,-10,10,.5],['Product p',40,-20,100,.5]]:mode===2?[['a',3,-5,10,1],['b',1,-5,10,1],['c',4,-5,10,1],['d',1,-5,10,1]]:[['a',.6,-1,1,.05],['b',.8,-1,1,.05],['c',0,-1,1,.05]];
for(const [name,value,min,max,step] of defs){const lab=document.createElement('label');lab.textContent=name+' ';const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=value;input.dataset.name=name;const out=document.createElement('b');out.textContent=value;input.oninput=()=>{out.textContent=input.value;render()};lab.append(input,out);wrap.append(lab)}
const get=n=>+document.querySelector('[data-name="'+n+'"]').value;
function line(x1,y1,x2,y2,color='#326da5',width=3){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function dot(x,y,color='#d65b41'){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,7,0,2*Math.PI);ctx.fill()}
function text(s,x,y,color='#20374d',size=16){ctx.fillStyle=color;ctx.font=size+'px system-ui';ctx.fillText(s,x,y)}
function fmt(x){return Math.abs(x)<1e-8?'0':Number(x.toFixed(3)).toString()}
function render(){ctx.clearRect(0,0,780,320);ctx.fillStyle='#fff';ctx.fillRect(0,0,780,320);line(55,160,730,160,'#aab8c7',1);text('0',48,180);
if(mode===1){const m=get('Mean m'),p=get('Product p'),D=m*m-p,delta=Math.sqrt(Math.abs(D));const scale=18,center=390+m*scale/2;line(70,160,710,160,'#aab8c7',2);dot(center,160,'#334f79');text('mean = '+fmt(m),center-50,130);if(D>=0){dot(center-delta*scale,160);dot(center+delta*scale,160);text('λ₁ = '+fmt(m-delta),110,60);text('λ₂ = '+fmt(m+delta),470,60)}else{text('Complex roots: '+fmt(m)+' ± '+fmt(delta)+'i',160,70)}result.innerHTML=['1. Trace tells us the mean: m = '+fmt(m),'2. Determinant gives the product: p = '+fmt(p),'3. d² = m² − p = '+fmt(D)+'; eigenvalues = '+fmt(m)+(D>=0?' ± '+fmt(delta):' ± '+fmt(delta)+'i')][phase%3]}
else if(mode===2){const a=get('a'),b=get('b'),c=get('c'),d=get('d'),m=(a+d)/2,p=a*d-b*c,D=m*m-p,s=Math.sqrt(Math.abs(D));text('A = [ '+a+'   '+b+' ]',170,75);text('       [ '+c+'   '+d+' ]',170,103);text('trace = '+(a+d),450,70);text('det = '+p,450,100);text('mean = '+fmt(m),450,130);text('m² − p = '+fmt(D),450,160);text('λ = '+fmt(m)+' ± '+fmt(s)+(D<0?'i':''),170,240,'#16588e',23);result.innerHTML=['1. Add diagonal entries: '+a+' + '+d+' = '+(a+d),'2. Multiply diagonals and subtract: '+a+'×'+d+' − '+b+'×'+c+' = '+p,'3. Eigenvalues: '+fmt(m)+' ± '+fmt(s)+(D<0?'i':'')][phase%3]}
else{const a=get('a'),b=get('b'),c=get('c'),n=Math.hypot(a,b,c),x=n?a/n:0,y=n?b/n:0,z=n?c/n:0;const px=390+150*x,py=160-115*y;line(390,160,px,py,'#2e7a99',4);dot(px,py);text('Normalized direction (a,b,c) = ('+fmt(x)+', '+fmt(y)+', '+fmt(z)+')',65,45);text('H = aX + bY + cZ',70,260);text('det(H) = −(a² + b² + c²) = −1',70,288);result.innerHTML=['1. Normalize the direction: divide (a,b,c) by its length.','2. Trace of H is zero: mean m = 0.','3. Determinant is −1: eigenvalues = 0 ± √1 = +1 and −1.'][phase%3]}
}
document.getElementById('step').onclick=()=>{phase=(phase+1)%3;render()};document.getElementById('pause').onclick=()=>{clearInterval(timer);timer=null};document.getElementById('play').onclick=()=>{if(timer)return;timer=setInterval(()=>{phase=(phase+1)%3;render()},1500)};document.getElementById('reset').onclick=()=>{clearInterval(timer);timer=null;phase=0;document.querySelectorAll('input').forEach((el,i)=>{el.value=defs[i][1];el.nextSibling.textContent=el.value});render()};render();
</script></body></html>
