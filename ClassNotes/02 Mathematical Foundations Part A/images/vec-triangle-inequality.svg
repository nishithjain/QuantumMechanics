<text x="400.0" y="120.0" font-size="14" fill="#222222" text-anchor="start">8.06  &#8804;  5.10 + 3.61 = 8.71   &#10003;</text>
<text x="400.0" y="160.0" font-size="13" fill="#222222" text-anchor="start">Walk from O straight to u + v (red),</text>
<text x="400.0" y="180.0" font-size="13" fill="#222222" text-anchor="start">or take the detour: first u, then v.</text>
<text x="400.0" y="200.0" font-size="13" fill="#222222" text-anchor="start" font-weight="bold">The detour is never shorter.</text>
<rect x="388.0" y="232.0" width="290.0" height="82.0" rx="6" fill="#f4f7fc" stroke="#9ab" stroke-width="1.2"/>
<text x="400.0" y="256.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Cauchy&#8211;Schwarz</text>
<text x="400.0" y="278.0" font-size="14" fill="#222222" text-anchor="start">|&#10216;u, v&#10217;| &#8804; &#8214;u&#8214; &#8214;v&#8214;</text>
<text x="400.0" y="300.0" font-size="12" fill="#777777" text-anchor="start">equality only if u, v are parallel</text>
