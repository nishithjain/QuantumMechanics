<text x="298.0" y="241.0" font-size="13" fill="#2e8b2e" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v,  &#8214;v&#8214; = 3.61</text>
<text x="228.8" y="208.1" font-size="13" fill="#d62828" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">&#8214;u + v&#8214; = 8.06</text>
