<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="440" height="420" font-family="Arial, Helvetica, sans-serif">
  <title>Polar form of a complex number: length r and angle theta, shown for z = 2 + 3i</title>
  <defs>
    <marker id="axP" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="zP" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#1f5fbf"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="420" fill="#ffffff"/>
  <text x="220" y="18" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Polar form: how far (r) and which direction (&#952;)</text>
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="120" y1="50" x2="120" y2="300"/>
    <line x1="180" y1="50" x2="180" y2="300"/>
    <line x1="240" y1="50" x2="240" y2="300"/>
    <line x1="300" y1="50" x2="300" y2="300"/>
    <line x1="60" y1="240" x2="310" y2="240"/>
    <line x1="60" y1="180" x2="310" y2="180"/>
    <line x1="60" y1="120" x2="310" y2="120"/>
    <line x1="60" y1="60" x2="310" y2="60"/>
  </g>
  <line x1="30" y1="300" x2="335" y2="300" stroke="#222" stroke-width="2" marker-end="url(#axP)"/>
  <line x1="60" y1="318" x2="60" y2="36" stroke="#222" stroke-width="2" marker-end="url(#axP)"/>
  <text x="340" y="296" font-size="13" fill="#222">Real axis</text>
  <text x="70" y="42" font-size="13" fill="#222">Imaginary axis</text>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="120" y="316">1</text>
    <text x="180" y="316">2</text>
    <text x="240" y="316">3</text>
    <text x="300" y="316">4</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="end">
    <text x="52" y="244">i</text>
    <text x="52" y="184">2i</text>
    <text x="52" y="124">3i</text>
    <text x="52" y="64">4i</text>
  </g>
  <polygon points="60,300 180,300 180,120" fill="#fff4e0"/>
  <line x1="60" y1="300" x2="180" y2="300" stroke="#e07b00" stroke-width="4"/>
  <line x1="180" y1="300" x2="180" y2="120" stroke="#e07b00" stroke-width="4" stroke-dasharray="8,5"/>
  <polyline points="170,300 170,290 180,290" fill="none" stroke="#555" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="180" y2="120" stroke="#1f5fbf" stroke-width="4" marker-end="url(#zP)"/>
  <path d="M 100,300 A 40 40 0 0 0 82.2,266.7" fill="none" stroke="#d62828" stroke-width="3"/>
  <text x="112" y="284" font-size="17" font-weight="bold" fill="#d62828">&#952;</text>
  <circle cx="60" cy="300" r="4" fill="#222"/>
  <circle cx="180" cy="120" r="5" fill="#1f5fbf"/>
  <text x="190" y="124" font-size="15" font-weight="bold" fill="#1f5fbf">z = 2 + 3i</text>
  <text x="120" y="336" font-size="13" font-weight="bold" fill="#e07b00" text-anchor="middle">a = r cos &#952;  (= 2)</text>
  <text x="190" y="214" font-size="13" font-weight="bold" fill="#e07b00">b = r sin &#952;  (= 3)</text>
  <text x="105" y="200" font-size="13" font-weight="bold" fill="#1f5fbf" text-anchor="middle" transform="rotate(-56.31 105 200)">r = |z| = &#8730;13 &#8776; 3.61</text>
  <text x="220" y="360" font-size="13" fill="#222" text-anchor="middle">tan &#952; = b / a = 3 / 2</text>
  <text x="220" y="380" font-size="13" fill="#222" text-anchor="middle">&#952; = arctan(3/2) &#8776; 56.3&#176; &#8776; 0.983 radians</text>
  <text x="220" y="402" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">z = a + bi = r (cos &#952; + i sin &#952;)</text>
</svg>
