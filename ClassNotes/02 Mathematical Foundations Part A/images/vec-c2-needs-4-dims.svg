<text x="536.0" y="178.0" font-size="13" fill="#1f5fbf" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">z&#8322; = 2</text>
<text x="310.0" y="190.0" font-size="40" fill="#777777" text-anchor="middle" font-weight="bold">+</text>
<text x="310.0" y="300.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v = (z&#8321;, z&#8322;) = (1 + i, 2)</text>
<text x="310.0" y="324.0" font-size="13" fill="#222222" text-anchor="middle">Each complex number needs a whole plane (2 real numbers).</text>
<text x="310.0" y="344.0" font-size="13" fill="#222222" text-anchor="middle">So v is 4 real numbers: (1, 1, 2, 0). That needs 4 dimensions.</text>
<text x="310.0" y="364.0" font-size="13" fill="#d62828" text-anchor="middle" font-weight="bold">We only have 3 to draw in, so we draw R&#178; cartoons and trust the algebra.</text>
