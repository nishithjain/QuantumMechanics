<text x="565.0" y="108.0" font-size="12" fill="#d62828" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v&#8322; = (5, 10) = 5 v&#8321;</text>
