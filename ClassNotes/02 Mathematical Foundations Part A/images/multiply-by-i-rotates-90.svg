<text x="388" y="182" font-size="12" fill="#1f5fbf">length 5, angle 53.1&#176;</text>
<text x="92" y="206" font-size="13" font-weight="bold" fill="#2e8b2e" text-anchor="end">iz = &#8722;4 + 3i</text>
<text x="92" y="222" font-size="12" fill="#2e8b2e" text-anchor="end">length 5, angle 143.1&#176;</text>
<text x="260" y="412" font-size="13" fill="#222" text-anchor="middle">(3, 4) &#8594; (&#8722;4, 3): same length 5, angle 53.1&#176; + 90&#176; = 143.1&#176;</text>
<text x="260" y="432" font-size="13" fill="#e68a00" text-anchor="middle">Orange dot: i = e<tspan dy="-5" font-size="10">i&#960;/2</tspan><tspan dy="5"> = (0, 1): length 1, angle 90&#176;. Grid: 1 square = 1 unit.</tspan></text>
