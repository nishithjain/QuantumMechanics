<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Arial, Helvetica, sans-serif"><defs><marker id="m444" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs><rect width="760" height="470" fill="#ffffff"/>
<text x="380.0" y="24.0" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">One pair in C^2: two points, four real numbers</text>
<text x="200.0" y="58.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Two labelled points on one plane</text>
