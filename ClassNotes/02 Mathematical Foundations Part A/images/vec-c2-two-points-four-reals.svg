<circle cx="226.0" cy="296.0" r="6" fill="#1f5fbf"/>
<circle cx="330.0" cy="192.0" r="6" fill="#2e8b2e"/>
<circle cx="70.0" cy="400.0" r="3.5" fill="#222222"/>
<text x="236.0" y="288.0" font-size="13" fill="#1f5fbf" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">z1 = 3 + 2i</text>
<text x="236.0" y="306.0" font-size="12" fill="#1f5fbf" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">point (3, 2)</text>
<text x="322.0" y="182.0" font-size="13" fill="#2e8b2e" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">z2 = 5 + 4i</text>
<text x="322.0" y="198.0" font-size="12" fill="#2e8b2e" text-anchor="end" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">point (5, 4)</text>
<text x="226.0" y="416.0" font-size="12" fill="#1f5fbf" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">3</text>
<text x="62.0" y="300.0" font-size="12" fill="#1f5fbf" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">2</text>
<text x="330.0" y="416.0" font-size="12" fill="#2e8b2e" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">5</text>
<text x="62.0" y="196.0" font-size="12" fill="#2e8b2e" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">4</text>
<text x="560.0" y="58.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">The same vector, unpacked</text>
<text x="560.0" y="82.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">v = (3 + 2i,  5 + 4i)</text>
<rect x="430.0" y="108.0" width="46.0" height="40.0" rx="6" fill="#f4f7fb" stroke="#1f5fbf" stroke-width="2"/>
<text x="453.0" y="135.0" font-size="18" fill="#1f5fbf" text-anchor="middle" font-weight="bold">3</text>
<text x="490.0" y="126.0" font-size="14" fill="#1f5fbf" text-anchor="start" font-weight="bold">Re(z1)</text>
<text x="490.0" y="144.0" font-size="12" fill="#777777" text-anchor="start">moves z1 left / right</text>
<rect x="430.0" y="170.0" width="46.0" height="40.0" rx="6" fill="#f4f7fb" stroke="#1f5fbf" stroke-width="2"/>
<text x="453.0" y="197.0" font-size="18" fill="#1f5fbf" text-anchor="middle" font-weight="bold">2</text>
<text x="490.0" y="188.0" font-size="14" fill="#1f5fbf" text-anchor="start" font-weight="bold">Im(z1)</text>
<text x="490.0" y="206.0" font-size="12" fill="#777777" text-anchor="start">moves z1 up / down</text>
<rect x="430.0" y="232.0" width="46.0" height="40.0" rx="6" fill="#f4f7fb" stroke="#2e8b2e" stroke-width="2"/>
<text x="453.0" y="259.0" font-size="18" fill="#2e8b2e" text-anchor="middle" font-weight="bold">5</text>
<text x="490.0" y="250.0" font-size="14" fill="#2e8b2e" text-anchor="start" font-weight="bold">Re(z2)</text>
<text x="490.0" y="268.0" font-size="12" fill="#777777" text-anchor="start">moves z2 left / right</text>
<rect x="430.0" y="294.0" width="46.0" height="40.0" rx="6" fill="#f4f7fb" stroke="#2e8b2e" stroke-width="2"/>
<text x="453.0" y="321.0" font-size="18" fill="#2e8b2e" text-anchor="middle" font-weight="bold">4</text>
<text x="490.0" y="312.0" font-size="14" fill="#2e8b2e" text-anchor="start" font-weight="bold">Im(z2)</text>
<text x="490.0" y="330.0" font-size="12" fill="#777777" text-anchor="start">moves z2 up / down</text>
<rect x="418.0" y="100.0" width="320.0" height="258.0" rx="8" fill="none" stroke="#cccccc" stroke-width="1.2"/>
<text x="560.0" y="390.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">Each of the four numbers</text>
<text x="560.0" y="410.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">can change on its own.</text>
<text x="560.0" y="436.0" font-size="13" fill="#d62828" text-anchor="middle" font-weight="bold">So the space of all such pairs</text>
<text x="560.0" y="456.0" font-size="13" fill="#d62828" text-anchor="middle" font-weight="bold">has 4 real dimensions.</text>
</svg>
