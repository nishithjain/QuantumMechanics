<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="440" height="420" font-family="Arial, Helvetica, sans-serif">
  <title>Adding complex numbers: (3 + 2i) + (1 - 4i) = 4 - 2i, shown as vector addition with a parallelogram</title>
  <defs>
    <marker id="axA" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="zA" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#1f5fbf"/></marker>
    <marker id="wA" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#d62828"/></marker>
    <marker id="sA" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#2e8b2e"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="420" fill="#ffffff"/>
  <text x="230" y="18" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">(3 + 2i) + (1 &#8722; 4i) = 4 &#8722; 2i</text>
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="110" y1="40" x2="110" y2="390"/>
    <line x1="160" y1="40" x2="160" y2="390"/>
    <line x1="210" y1="40" x2="210" y2="390"/>
    <line x1="260" y1="40" x2="260" y2="390"/>
    <line x1="310" y1="40" x2="310" y2="390"/>
    <line x1="60" y1="40" x2="330" y2="40"/>
    <line x1="60" y1="90" x2="330" y2="90"/>
    <line x1="60" y1="140" x2="330" y2="140"/>
    <line x1="60" y1="240" x2="330" y2="240"/>
    <line x1="60" y1="290" x2="330" y2="290"/>
    <line x1="60" y1="340" x2="330" y2="340"/>
    <line x1="60" y1="390" x2="330" y2="390"/>
  </g>
  <line x1="30" y1="190" x2="345" y2="190" stroke="#222" stroke-width="2" marker-end="url(#axA)"/>
  <line x1="60" y1="405" x2="60" y2="30" stroke="#222" stroke-width="2" marker-end="url(#axA)"/>
  <text x="350" y="186" font-size="13" fill="#222">Real axis</text>
  <text x="70" y="36" font-size="13" fill="#222">Imaginary axis</text>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="110" y="203">1</text>
    <text x="160" y="203">2</text>
    <text x="210" y="203">3</text>
    <text x="260" y="203">4</text>
    <text x="310" y="203">5</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="end">
    <text x="52" y="44">3i</text>
    <text x="52" y="94">2i</text>
    <text x="52" y="144">i</text>
    <text x="52" y="244">&#8722;i</text>
    <text x="52" y="294">&#8722;2i</text>
    <text x="52" y="344">&#8722;3i</text>
    <text x="52" y="394">&#8722;4i</text>
  </g>
  <polygon points="60,190 210,90 260,290 110,390" fill="#f1e9ff" fill-opacity="0.8" stroke="none"/>
  <line x1="210" y1="90" x2="260" y2="290" stroke="#d62828" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="110" y1="390" x2="260" y2="290" stroke="#1f5fbf" stroke-width="2.5" stroke-dasharray="7,5"/>
  <line x1="60" y1="190" x2="210" y2="90" stroke="#1f5fbf" stroke-width="4" marker-end="url(#zA)"/>
  <line x1="60" y1="190" x2="110" y2="390" stroke="#d62828" stroke-width="4" marker-end="url(#wA)"/>
  <line x1="60" y1="190" x2="260" y2="290" stroke="#2e8b2e" stroke-width="5" marker-end="url(#sA)"/>
  <circle cx="60" cy="190" r="4" fill="#222"/>
  <text x="220" y="84" font-size="15" font-weight="bold" fill="#1f5fbf">z = 3 + 2i</text>
  <text x="122" y="394" font-size="15" font-weight="bold" fill="#d62828">w = 1 &#8722; 4i</text>
  <text x="270" y="294" font-size="15" font-weight="bold" fill="#2e8b2e">z + w = 4 &#8722; 2i</text>
  <text x="230" y="412" font-size="12" fill="#555" text-anchor="middle">real parts: 3 + 1 = 4     imaginary parts: 2 + (&#8722;4) = &#8722;2</text>
</svg>
