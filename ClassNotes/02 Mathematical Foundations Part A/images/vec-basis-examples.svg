<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Arial, Helvetica, sans-serif"><defs><marker id="m444" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker><marker id="m1f5fbf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fbf"/></marker><marker id="m2e8b2e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2e8b2e"/></marker><marker id="md62828" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#d62828"/></marker></defs><rect width="720" height="340" fill="#ffffff"/>
<text x="360.0" y="24.0" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">What is (and is not) a basis</text>
<text x="120.0" y="60.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">A line through the origin</text>
<line x1="19.2" y1="190.0" x2="220.8" y2="190.0" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="120.0" y1="274.0" x2="120.0" y2="94.8" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="24.8" y1="237.6" x2="215.2" y2="142.4" stroke="#9ec3f0" stroke-width="9" stroke-opacity="0.8"/>
<line x1="120.0" y1="190.0" x2="176.0" y2="162.0" stroke="#1f5fbf" stroke-width="3" marker-end="url(#m1f5fbf)"/>
<line x1="120.0" y1="190.0" x2="86.4" y2="206.8" stroke="#2e8b2e" stroke-width="3" marker-end="url(#m2e8b2e)"/>
<line x1="120.0" y1="190.0" x2="142.4" y2="134.0" stroke="#d62828" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#md62828)"/>
<text x="170.0" y="152.0" font-size="14" fill="#1f5fbf" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v</text>
<text x="82.4" y="226.8" font-size="14" fill="#2e8b2e" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">w</text>
<text x="150.4" y="134.0" font-size="14" fill="#d62828" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">z</text>
<text x="120.0" y="285.0" font-size="12" fill="#2e8b2e" text-anchor="middle" font-weight="bold">{v} is a basis, and so is {w}.</text>
<text x="120.0" y="302.0" font-size="11" fill="#222222" text-anchor="middle">{v, w} is not (dependent). {z} spans another line.</text>
<text x="120.0" y="318.0" font-size="11" fill="#777777" text-anchor="middle">A line is 1-dimensional: one basis vector.</text>
<text x="360.0" y="60.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">The whole plane</text>
<rect x="250.0" y="70.0" width="220.0" height="195.0" rx="0" fill="#dce9f9" stroke="none" stroke-width="0" fill-opacity="1"/>
<line x1="259.2" y1="190.0" x2="460.8" y2="190.0" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="360.0" y1="274.0" x2="360.0" y2="94.8" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="360.0" y1="190.0" x2="416.0" y2="162.0" stroke="#1f5fbf" stroke-width="3" marker-end="url(#m1f5fbf)"/>
<line x1="360.0" y1="190.0" x2="332.0" y2="134.0" stroke="#d62828" stroke-width="3" marker-end="url(#md62828)"/>
<text x="410.0" y="180.0" font-size="14" fill="#1f5fbf" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v&#8321;</text>
<text x="324.0" y="138.0" font-size="14" fill="#d62828" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v&#8322;</text>
<text x="360.0" y="285.0" font-size="12" fill="#2e8b2e" text-anchor="middle" font-weight="bold">{v&#8321;, v&#8322;} is a basis of the plane.</text>
<text x="360.0" y="302.0" font-size="11" fill="#222222" text-anchor="middle">Independent AND their span is everything.</text>
<text x="360.0" y="318.0" font-size="11" fill="#777777" text-anchor="middle">A plane is 2-dimensional: two basis vectors.</text>
<text x="600.0" y="60.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Two vectors on one line</text>
<rect x="490.0" y="70.0" width="220.0" height="195.0" rx="0" fill="#dce9f9" stroke="none" stroke-width="0" fill-opacity="1"/>
<line x1="499.2" y1="190.0" x2="700.8" y2="190.0" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="600.0" y1="274.0" x2="600.0" y2="94.8" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="510.4" y1="234.8" x2="689.6" y2="145.2" stroke="#9ec3f0" stroke-width="9" stroke-opacity="0.8"/>
<line x1="600.0" y1="190.0" x2="644.8" y2="167.6" stroke="#1f5fbf" stroke-width="3" marker-end="url(#m1f5fbf)"/>
<line x1="600.0" y1="190.0" x2="684.0" y2="148.0" stroke="#d62828" stroke-width="2.6" marker-end="url(#md62828)"/>
<text x="640.8" y="187.6" font-size="14" fill="#1f5fbf" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v&#8321;</text>
<text x="682.0" y="136.0" font-size="14" fill="#d62828" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v&#8322;</text>
<text x="600.0" y="285.0" font-size="12" fill="#d62828" text-anchor="middle" font-weight="bold">{v&#8321;, v&#8322;} is NOT a basis of the plane.</text>
<text x="600.0" y="302.0" font-size="11" fill="#222222" text-anchor="middle">They are dependent: the span is only a line.</text>
<text x="600.0" y="318.0" font-size="11" fill="#777777" text-anchor="middle">Dependent vectors never form a basis.</text>
</svg>
