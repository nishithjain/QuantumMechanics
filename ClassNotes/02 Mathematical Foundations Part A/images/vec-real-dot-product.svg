<circle cx="180.0" cy="70.0" r="4.5" fill="#d62828"/>
<text x="268.0" y="314.0" font-size="13" fill="#1f5fbf" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">u = (5, 1)</text>
<text x="188.0" y="68.0" font-size="13" fill="#d62828" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v = (3, 7)</text>
<text x="119.5" y="261.8" font-size="12" fill="#2e8b2e" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">projection of u on v</text>
<text x="340.0" y="90.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">u &#183; v = u&#8321;v&#8321; + u&#8322;v&#8322;</text>
<text x="340.0" y="116.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">= 5&#183;3 + 1&#183;7 = 15 + 7 = 22</text>
<text x="340.0" y="150.0" font-size="14" fill="#222222" text-anchor="start">The same number as   &#8214;u&#8214; &#183; &#8214;v&#8214; &#183; cos &#952;</text>
<text x="340.0" y="180.0" font-size="13" fill="#2e8b2e" text-anchor="start" font-weight="bold">&#8214;u&#8214; cos &#952; = length of the green projection</text>
<text x="340.0" y="200.0" font-size="13" fill="#222222" text-anchor="start">so  u &#183; v = (green length) &#215; &#8214;v&#8214;</text>
<rect x="328.0" y="228.0" width="330.0" height="118.0" rx="6" fill="#f4f7fc" stroke="#9ab" stroke-width="1.2"/>
<text x="340.0" y="252.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">What the dot product gives you</text>
<text x="340.0" y="274.0" font-size="13" fill="#222222" text-anchor="start">length:   &#8214;v&#8214;&#178; = v &#183; v</text>
<text x="340.0" y="294.0" font-size="13" fill="#222222" text-anchor="start">angle:    cos &#952; = u &#183; v / (&#8214;u&#8214;&#8214;v&#8214;)</text>
<text x="340.0" y="314.0" font-size="13" fill="#222222" text-anchor="start">perpendicular:   u &#183; v = 0</text>
<text x="340.0" y="336.0" font-size="11" fill="#777777" text-anchor="start">(cosine similarity in vector search)</text>
</svg>
