<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" width="440" height="350" font-family="Arial, Helvetica, sans-serif">
  <title>Graph of y = x^2 + 1: the curve never touches the x-axis (y = 0)</title>
  <defs>
    <marker id="axisArrow3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="440" height="350" fill="#ffffff"/>
  <text x="220" y="16" font-size="16" font-weight="bold" fill="#1f5fbf" text-anchor="middle">y = x² + 1</text>

  <!-- grid: x axis centre at 210 (50 px per unit), y=0 at pixel 270 (25 px per unit) -->
  <g stroke="#e2e2e2" stroke-width="1">
    <line x1="60" y1="20" x2="60" y2="270"/>
    <line x1="110" y1="20" x2="110" y2="270"/>
    <line x1="160" y1="20" x2="160" y2="270"/>
    <line x1="210" y1="20" x2="210" y2="270"/>
    <line x1="260" y1="20" x2="260" y2="270"/>
    <line x1="310" y1="20" x2="310" y2="270"/>
    <line x1="360" y1="20" x2="360" y2="270"/>
    <line x1="35" y1="245" x2="385" y2="245"/>
    <line x1="35" y1="220" x2="385" y2="220"/>
    <line x1="35" y1="195" x2="385" y2="195"/>
    <line x1="35" y1="170" x2="385" y2="170"/>
    <line x1="35" y1="145" x2="385" y2="145"/>
    <line x1="35" y1="120" x2="385" y2="120"/>
    <line x1="35" y1="95" x2="385" y2="95"/>
    <line x1="35" y1="70" x2="385" y2="70"/>
    <line x1="35" y1="45" x2="385" y2="45"/>
    <line x1="35" y1="20" x2="385" y2="20"/>
  </g>

  <!-- vertical axis (x = 0) -->
  <line x1="210" y1="270" x2="210" y2="26" stroke="#222" stroke-width="2"/>

  <!-- horizontal axis y = 0 : the line the curve would have to touch -->
  <line x1="30" y1="270" x2="405" y2="270" stroke="#d62828" stroke-width="3" marker-end="url(#axisArrow3)"/>
  <text x="412" y="274" font-size="15" fill="#222" font-style="italic">x</text>
  <text x="204" y="36" font-size="15" fill="#222" font-style="italic" text-anchor="end">y</text>

  <!-- tick labels -->
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="60" y="290">-3</text>
    <text x="110" y="290">-2</text>
    <text x="160" y="290">-1</text>
    <text x="260" y="290">1</text>
    <text x="310" y="290">2</text>
    <text x="360" y="290">3</text>
    <text x="210" y="290">0</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="end">
    <text x="198" y="249">1</text>
    <text x="198" y="224">2</text>
    <text x="198" y="149">5</text>
    <text x="198" y="24">10</text>
  </g>

  <!-- the curve y = x^2 + 1 -->
  <path d="M 60.0,20.0 L 72.5,55.9 L 85.0,88.8 L 97.5,118.4 L 110.0,145.0 L 122.5,168.4 L 135.0,188.8 L 147.5,205.9 L 160.0,220.0 L 172.5,230.9 L 185.0,238.8 L 197.5,243.4 L 210.0,245.0 L 222.5,243.4 L 235.0,238.8 L 247.5,230.9 L 260.0,220.0 L 272.5,205.9 L 285.0,188.8 L 297.5,168.4 L 310.0,145.0 L 322.5,118.4 L 335.0,88.8 L 347.5,55.9 L 360.0,20.0" fill="none" stroke="#1f5fbf" stroke-width="3"/>
  <circle cx="60" cy="20" r="4.5" fill="#1f5fbf"/>
  <circle cx="110" cy="145" r="4.5" fill="#1f5fbf"/>
  <circle cx="160" cy="220" r="4.5" fill="#1f5fbf"/>
  <circle cx="210" cy="245" r="4.5" fill="#1f5fbf"/>
  <circle cx="260" cy="220" r="4.5" fill="#1f5fbf"/>
  <circle cx="310" cy="145" r="4.5" fill="#1f5fbf"/>
  <circle cx="360" cy="20" r="4.5" fill="#1f5fbf"/>

  <!-- lowest point -->
  <circle cx="210" cy="245" r="6" fill="none" stroke="#e07b00" stroke-width="2.5"/>
  <text x="210" y="204" font-size="13" fill="#e07b00" font-weight="bold" text-anchor="middle">lowest point</text>
  <text x="210" y="221" font-size="13" fill="#e07b00" font-weight="bold" text-anchor="middle">(0, 1)</text>

  <!-- annotation for the red axis -->
  <text x="220" y="314" font-size="13" fill="#d62828" font-weight="bold" text-anchor="middle">Red line: y = 0. A solution of x² + 1 = 0</text>
  <text x="220" y="329" font-size="13" fill="#d62828" font-weight="bold" text-anchor="middle">needs the curve to touch it. It never does,</text>
  <text x="220" y="344" font-size="13" fill="#d62828" font-weight="bold" text-anchor="middle">so there is no real solution.</text>
</svg>
