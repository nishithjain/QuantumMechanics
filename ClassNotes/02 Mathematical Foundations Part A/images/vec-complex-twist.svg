<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="Arial, Helvetica, sans-serif"><defs><marker id="me68a00" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#e68a00"/></marker></defs><rect width="640" height="330" fill="#ffffff"/>
<text x="320.0" y="24.0" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">A complex twist: are u and w independent?</text>
<text x="110.0" y="56.0" font-size="15" fill="#1f5fbf" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">u</text>
<path d="M87.0,66.0 L80.0,66.0 L80.0,122.0 L87.0,122.0" fill="none" stroke="#1f5fbf" stroke-width="1.6"/>
<path d="M133.0,66.0 L140.0,66.0 L140.0,122.0 L133.0,122.0" fill="none" stroke="#1f5fbf" stroke-width="1.6"/>
<text x="110.0" y="86.2" font-size="17" fill="#1f5fbf" text-anchor="middle">1</text>
<text x="110.0" y="114.2" font-size="17" fill="#1f5fbf" text-anchor="middle">i</text>
<text x="530.0" y="56.0" font-size="15" fill="#d62828" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">w</text>
<path d="M507.0,66.0 L500.0,66.0 L500.0,122.0 L507.0,122.0" fill="none" stroke="#d62828" stroke-width="1.6"/>
<path d="M553.0,66.0 L560.0,66.0 L560.0,122.0 L553.0,122.0" fill="none" stroke="#d62828" stroke-width="1.6"/>
<text x="530.0" y="86.2" font-size="17" fill="#d62828" text-anchor="middle">i</text>
<text x="530.0" y="114.2" font-size="17" fill="#d62828" text-anchor="middle">&#8722;1</text>
<line x1="165.0" y1="94.0" x2="475.0" y2="94.0" stroke="#e68a00" stroke-width="3" marker-end="url(#me68a00)"/>
<text x="320.0" y="80.0" font-size="14" fill="#e68a00" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">multiply by the complex number i</text>
<text x="320.0" y="116.0" font-size="13" fill="#222222" text-anchor="middle">i &#183; (1, i) = (i&#183;1, i&#183;i) = (i, i&#178;) = (i, &#8722;1)</text>
<rect x="30.0" y="150.0" width="270.0" height="90.0" rx="6" fill="#eef7ee" stroke="#2e8b2e" stroke-width="1.4"/>
<text x="165.0" y="176.0" font-size="14" fill="#2e8b2e" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Over R (real scalars only)</text>
<text x="165.0" y="198.0" font-size="12.5" fill="#222222" text-anchor="middle">no real number t gives w = t&#183;u</text>
<text x="165.0" y="222.0" font-size="14" fill="#2e8b2e" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">&#8594; independent</text>
<rect x="340.0" y="150.0" width="270.0" height="90.0" rx="6" fill="#fdeeee" stroke="#d62828" stroke-width="1.4"/>
<text x="475.0" y="176.0" font-size="14" fill="#d62828" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Over C (complex scalars)</text>
<text x="475.0" y="198.0" font-size="12.5" fill="#222222" text-anchor="middle">w = i&#183;u, so w is a multiple of u</text>
<text x="475.0" y="222.0" font-size="14" fill="#d62828" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">&#8594; dependent!</text>
<text x="320.0" y="275.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">"Parallel" in C&#8319; means "a complex multiple of each other".</text>
<text x="320.0" y="297.0" font-size="12" fill="#777777" text-anchor="middle">Same idea as global phase: &#968; and e^(i&#966;)&#183;&#968; point in the same complex direction.</text>
</svg>
