<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 410" width="440" height="410" font-family="Arial, Helvetica, sans-serif">
  <title>Polar form of 1 + i: r = sqrt(2), theta = 45 degrees = pi/4</title>
  <defs>
    <marker id="axT" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="zT" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#1f5fbf"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="410" fill="#ffffff"/>
  <text x="220" y="20" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Example: z = 1 + i</text>
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="160" y1="50" x2="160" y2="270"/>
    <line x1="260" y1="50" x2="260" y2="270"/>
    <line x1="60" y1="170" x2="270" y2="170"/>
    <line x1="60" y1="70" x2="270" y2="70"/>
  </g>
  <line x1="30" y1="270" x2="300" y2="270" stroke="#222" stroke-width="2" marker-end="url(#axT)"/>
  <line x1="60" y1="288" x2="60" y2="36" stroke="#222" stroke-width="2" marker-end="url(#axT)"/>
  <text x="306" y="266" font-size="13" fill="#222">Real axis</text>
  <text x="70" y="42" font-size="13" fill="#222">Imaginary axis</text>
  <g font-size="12" fill="#555" text-anchor="middle"><text x="160" y="286">1</text><text x="260" y="286">2</text></g>
  <g font-size="12" fill="#555" text-anchor="end"><text x="52" y="174">i</text><text x="52" y="74">2i</text></g>
  <polygon points="60,270 160,270 160,170" fill="#fff4e0"/>
  <line x1="60" y1="270" x2="160" y2="270" stroke="#e07b00" stroke-width="4"/>
  <line x1="160" y1="270" x2="160" y2="170" stroke="#e07b00" stroke-width="4" stroke-dasharray="8,5"/>
  <polyline points="150,270 150,260 160,260" fill="none" stroke="#555" stroke-width="1.5"/>
  <line x1="60" y1="270" x2="160" y2="170" stroke="#1f5fbf" stroke-width="4" marker-end="url(#zT)"/>
  <path d="M 100,270 A 40 40 0 0 0 88.3,241.7" fill="none" stroke="#d62828" stroke-width="3"/>
  <text x="108" y="256" font-size="16" font-weight="bold" fill="#d62828">&#952; = 45&#176;</text>
  <circle cx="60" cy="270" r="4" fill="#222"/>
  <circle cx="160" cy="170" r="5" fill="#1f5fbf"/>
  <text x="170" y="164" font-size="15" font-weight="bold" fill="#1f5fbf">z = 1 + i = (1, 1)</text>
  <text x="110" y="304" font-size="13" font-weight="bold" fill="#e07b00" text-anchor="middle">a = 1</text>
  <text x="170" y="224" font-size="13" font-weight="bold" fill="#e07b00">b = 1</text>
  <text x="92" y="196" font-size="13" font-weight="bold" fill="#1f5fbf" text-anchor="middle" transform="rotate(-45 92 196)">r = &#8730;2 &#8776; 1.414</text>
  <text x="220" y="338" font-size="13" fill="#222" text-anchor="middle">r = &#8730;(1&#178; + 1&#178;) = &#8730;2</text>
  <text x="220" y="358" font-size="13" fill="#222" text-anchor="middle">&#952; = 45&#176; = &#960;/4 radians   (since 360&#176; = 2&#960;)</text>
  <text x="220" y="384" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">1 + i = &#8730;2 (cos &#960;/4 + i sin &#960;/4)</text>
</svg>
