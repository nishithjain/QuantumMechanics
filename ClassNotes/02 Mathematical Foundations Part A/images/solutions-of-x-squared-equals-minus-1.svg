<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" width="440" height="340" font-family="Arial, Helvetica, sans-serif">
  <title>The two solutions of x^2 = -1 on the complex plane: i and -i</title>
  <defs>
    <marker id="axisArrow4" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="440" height="340" fill="#ffffff"/>
  <text x="220" y="20" font-size="16" font-weight="bold" fill="#1f5fbf" text-anchor="middle">Solutions of x&#178; = &#8722;1 on the complex plane</text>

  <!-- grid: origin at (220,180), 60 px per unit -->
  <g stroke="#e2e2e2" stroke-width="1">
    <line x1="100" y1="60" x2="100" y2="300"/>
    <line x1="160" y1="60" x2="160" y2="300"/>
    <line x1="280" y1="60" x2="280" y2="300"/>
    <line x1="340" y1="60" x2="340" y2="300"/>
    <line x1="40" y1="60" x2="400" y2="60"/>
    <line x1="40" y1="120" x2="400" y2="120"/>
    <line x1="40" y1="240" x2="400" y2="240"/>
    <line x1="40" y1="300" x2="400" y2="300"/>
  </g>

  <!-- axes -->
  <line x1="30" y1="180" x2="418" y2="180" stroke="#222" stroke-width="2" marker-end="url(#axisArrow4)"/>
  <line x1="220" y1="316" x2="220" y2="34" stroke="#222" stroke-width="2" marker-end="url(#axisArrow4)"/>
  <text x="414" y="200" font-size="14" fill="#222" text-anchor="end">Real axis</text>
  <text x="228" y="42" font-size="14" fill="#222">Imaginary axis</text>

  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="100" y="198">&#8722;2</text>
    <text x="160" y="198">&#8722;1</text>
    <text x="280" y="198">1</text>
    <text x="340" y="198">2</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="end">
    <text x="212" y="64">2i</text>
    <text x="212" y="124">i</text>
    <text x="212" y="244">&#8722;i</text>
    <text x="212" y="304">&#8722;2i</text>
  </g>

  <circle cx="220" cy="180" r="4" fill="#222"/>
  <text x="204" y="196" font-size="13" fill="#444" text-anchor="end">0</text>

  <g stroke="#1f5fbf" stroke-width="2" stroke-dasharray="6,5">
    <line x1="220" y1="180" x2="220" y2="120"/>
    <line x1="220" y1="180" x2="220" y2="240"/>
  </g>

  <circle cx="220" cy="120" r="6" fill="#1f5fbf"/>
  <circle cx="220" cy="240" r="6" fill="#d62828"/>
  <text x="234" y="116" font-size="15" fill="#1f5fbf" font-weight="bold">x = i</text>
  <text x="234" y="133" font-size="13" fill="#1f5fbf">because i&#178; = &#8722;1</text>
  <text x="234" y="236" font-size="15" fill="#d62828" font-weight="bold">x = &#8722;i</text>
  <text x="234" y="253" font-size="13" fill="#d62828">because (&#8722;i)&#178; = &#8722;1</text>
</svg>
