<line x1="198.0" y1="333.2" x2="198.0" y2="82.4" stroke="#e6e6e6" stroke-width="1"/>
<line x1="242.0" y1="333.2" x2="242.0" y2="82.4" stroke="#e6e6e6" stroke-width="1"/>
<line x1="286.0" y1="333.2" x2="286.0" y2="82.4" stroke="#e6e6e6" stroke-width="1"/>
<line x1="30.8" y1="320.0" x2="312.4" y2="320.0" stroke="#e6e6e6" stroke-width="1"/>
<line x1="30.8" y1="276.0" x2="312.4" y2="276.0" stroke="#e6e6e6" stroke-width="1"/>
