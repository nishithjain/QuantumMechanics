<path d="M231.6,279.5 L228.1,269.0 L238.5,265.6" fill="none" stroke="#555" stroke-width="1.2"/>
<path d="M120.4,316.5 L117.0,306.1 L106.5,309.6" fill="none" stroke="#555" stroke-width="1.2"/>
<text x="180.0" y="336.0" font-size="13" fill="#1f5fbf" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">u,  &#8214;u&#8214;&#178; = 10</text>
<text x="234.4" y="219.6" font-size="13" fill="#2e8b2e" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v,  &#8214;v&#8214;&#178; = 10</text>
<text x="190.0" y="134.0" font-size="13" fill="#d62828" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">u + v,  &#8214;u + v&#8214;&#178; = 20</text>
<text x="420.0" y="90.0" font-size="14" fill="#222222" text-anchor="start">If u &#8869; v, i.e. &#10216;u, v&#10217; = 0, then</text>
<text x="420.0" y="120.0" font-size="17" fill="#222222" text-anchor="start" font-weight="bold">&#8214;u + v&#8214;&#178; = &#8214;u&#8214;&#178; + &#8214;v&#8214;&#178;</text>
<text x="420.0" y="150.0" font-size="11.5" fill="#777777" text-anchor="start">Here: 3&#183;(&#8722;1) + 1&#183;3 = 0, so u &#8869; v, and 10 + 10 = 20  &#10003;</text>
<rect x="408.0" y="178.0" width="270.0" height="130.0" rx="6" fill="#f4f7fc" stroke="#9ab" stroke-width="1.2"/>
<text x="420.0" y="202.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Why it is true</text>
<text x="420.0" y="224.0" font-size="12.5" fill="#222222" text-anchor="start">&#10216;u + v, u + v&#10217;</text>
<text x="420.0" y="244.0" font-size="12.5" fill="#222222" text-anchor="start">= &#10216;u,u&#10217; + &#10216;u,v&#10217; + &#10216;v,u&#10217; + &#10216;v,v&#10217;</text>
<text x="420.0" y="264.0" font-size="12.5" fill="#222222" text-anchor="start">= &#8214;u&#8214;&#178; + 0 + 0 + &#8214;v&#8214;&#178;</text>
<text x="420.0" y="288.0" font-size="11.5" fill="#777777" text-anchor="start">(the two middle terms vanish: u &#8869; v)</text>
</svg>
