<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" width="440" height="430" font-family="Arial, Helvetica, sans-serif">
  <title>The modulus of 3 + 4i is the length of the hypotenuse of a 3-4-5 right triangle</title>
  <defs>
    <marker id="axM" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <marker id="zM" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" fill="#1f5fbf"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="430" fill="#ffffff"/>
  <text x="220" y="18" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Modulus = distance from the origin (Pythagoras)</text>
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="110" y1="40" x2="110" y2="300"/>
    <line x1="160" y1="40" x2="160" y2="300"/>
    <line x1="210" y1="40" x2="210" y2="300"/>
    <line x1="260" y1="40" x2="260" y2="300"/>
    <line x1="310" y1="40" x2="310" y2="300"/>
    <line x1="60" y1="250" x2="320" y2="250"/>
    <line x1="60" y1="200" x2="320" y2="200"/>
    <line x1="60" y1="150" x2="320" y2="150"/>
    <line x1="60" y1="100" x2="320" y2="100"/>
    <line x1="60" y1="50" x2="320" y2="50"/>
  </g>
  <line x1="30" y1="300" x2="345" y2="300" stroke="#222" stroke-width="2" marker-end="url(#axM)"/>
  <line x1="60" y1="318" x2="60" y2="30" stroke="#222" stroke-width="2" marker-end="url(#axM)"/>
  <text x="350" y="296" font-size="13" fill="#222">Real axis</text>
  <text x="70" y="36" font-size="13" fill="#222">Imaginary axis</text>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="110" y="316">1</text>
    <text x="160" y="316">2</text>
    <text x="210" y="316">3</text>
    <text x="260" y="316">4</text>
    <text x="310" y="316">5</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="end">
    <text x="52" y="254">i</text>
    <text x="52" y="204">2i</text>
    <text x="52" y="154">3i</text>
    <text x="52" y="104">4i</text>
    <text x="52" y="54">5i</text>
  </g>
  <polygon points="60,300 210,300 210,100" fill="#fff4e0" stroke="none"/>
  <line x1="60" y1="300" x2="210" y2="300" stroke="#e07b00" stroke-width="4"/>
  <line x1="210" y1="300" x2="210" y2="100" stroke="#e07b00" stroke-width="4" stroke-dasharray="8,5"/>
  <polyline points="200,300 200,290 210,290" fill="none" stroke="#555" stroke-width="1.5"/>
  <line x1="60" y1="300" x2="210" y2="100" stroke="#1f5fbf" stroke-width="4" marker-end="url(#zM)"/>
  <circle cx="60" cy="300" r="4" fill="#222"/>
  <circle cx="210" cy="100" r="5" fill="#1f5fbf"/>
  <text x="220" y="104" font-size="15" font-weight="bold" fill="#1f5fbf">z = 3 + 4i</text>
  <text x="135" y="336" font-size="14" font-weight="bold" fill="#e07b00" text-anchor="middle">a = 3 (real part)</text>
  <text x="220" y="204" font-size="14" font-weight="bold" fill="#e07b00">b = 4 (imaginary part)</text>
  <text x="120" y="186" font-size="15" font-weight="bold" fill="#1f5fbf" text-anchor="middle" transform="rotate(-53.13 120 186)">|z| = r = 5</text>
  <text x="220" y="362" font-size="12.5" fill="#222" text-anchor="middle">|z|&#178; = a&#178; + b&#178; = 3&#178; + 4&#178; = 9 + 16 = 25,  so  |z| = &#8730;25 = 5</text>
  <text x="220" y="386" font-size="12.5" fill="#222" text-anchor="middle">Check: z &#183; <tspan text-decoration="overline">z</tspan> = (3 + 4i)(3 &#8722; 4i) = 9 + 16 = 25 = |z|&#178;</text>
  <text x="220" y="410" font-size="12" fill="#555" text-anchor="middle">Other names for |z|: absolute value, magnitude, norm, r</text>
</svg>
