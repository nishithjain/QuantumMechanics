<text x="150.0" y="118.0" font-size="13" fill="#222222" text-anchor="end">90&#176; to 180&#176;</text>
<text x="150.0" y="136.0" font-size="13" fill="#2e8b2e" text-anchor="end" font-weight="bold">cos &#8722;,  sin +</text>
<text x="150.0" y="372.0" font-size="14" fill="#222222" text-anchor="end" font-weight="bold">Quadrant III</text>
<text x="150.0" y="390.0" font-size="13" fill="#222222" text-anchor="end">180&#176; to 270&#176;</text>
