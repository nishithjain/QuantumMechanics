<text x="470.0" y="390.0" font-size="13" fill="#222222" text-anchor="start">270&#176; to 360&#176;</text>
<text x="470.0" y="408.0" font-size="13" fill="#d62828" text-anchor="start" font-weight="bold">cos +,  sin &#8722;</text>
