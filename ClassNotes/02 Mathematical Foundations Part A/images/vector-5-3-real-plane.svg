<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" font-family="Arial, Helvetica, sans-serif">
  <title>The vector (5, 3) in the real plane R^2</title>
  <defs>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="vecArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 z" fill="#1f5fbf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="440" height="300" fill="#ffffff"/>

  <!-- grid: origin at (50,250), 50 px per unit -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="100" y1="20" x2="100" y2="250"/>
    <line x1="150" y1="20" x2="150" y2="250"/>
    <line x1="200" y1="20" x2="200" y2="250"/>
    <line x1="250" y1="20" x2="250" y2="250"/>
    <line x1="300" y1="20" x2="300" y2="250"/>
    <line x1="350" y1="20" x2="350" y2="250"/>
    <line x1="50" y1="200" x2="410" y2="200"/>
    <line x1="50" y1="150" x2="410" y2="150"/>
    <line x1="50" y1="100" x2="410" y2="100"/>
    <line x1="50" y1="50" x2="410" y2="50"/>
  </g>

  <!-- axes -->
  <line x1="50" y1="250" x2="420" y2="250" stroke="#222" stroke-width="2" marker-end="url(#axisArrow)"/>
  <line x1="50" y1="250" x2="50" y2="14" stroke="#222" stroke-width="2" marker-end="url(#axisArrow)"/>
  <text x="426" y="255" font-size="16" fill="#222" font-style="italic">x</text>
  <text x="44" y="10" font-size="16" fill="#222" font-style="italic" text-anchor="end">y</text>

  <!-- tick labels -->
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="50" y="268">0</text>
    <text x="100" y="268">1</text>
    <text x="150" y="268">2</text>
    <text x="200" y="268">3</text>
    <text x="250" y="268">4</text>
    <text x="300" y="268">5</text>
    <text x="350" y="268">6</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="end">
    <text x="40" y="254">0</text>
    <text x="40" y="204">1</text>
    <text x="40" y="154">2</text>
    <text x="40" y="104">3</text>
    <text x="40" y="54">4</text>
  </g>

  <!-- dashed projections of the point (5,3) -->
  <g stroke="#e07b00" stroke-width="2" stroke-dasharray="6,5">
    <line x1="300" y1="100" x2="300" y2="250"/>
    <line x1="300" y1="100" x2="50" y2="100"/>
  </g>
  <text x="300" y="288" font-size="14" fill="#e07b00" text-anchor="middle" font-weight="bold">x = 5</text>
  <text x="12" y="104" font-size="14" fill="#e07b00" font-weight="bold">y = 3</text>

  <!-- the vector from the origin to (5,3) -->
  <line x1="50" y1="250" x2="300" y2="100" stroke="#1f5fbf" stroke-width="4" marker-end="url(#vecArrow)"/>
  <circle cx="300" cy="100" r="5" fill="#1f5fbf"/>
  <circle cx="50" cy="250" r="4" fill="#222"/>
  <text x="312" y="92" font-size="16" fill="#1f5fbf" font-weight="bold">(5, 3)</text>
  <text x="150" y="160" font-size="16" fill="#1f5fbf" font-weight="bold" transform="rotate(-31 150 160)">vector</text>
</svg>
