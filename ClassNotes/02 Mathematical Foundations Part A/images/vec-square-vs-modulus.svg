<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Arial, Helvetica, sans-serif"><defs><marker id="m444" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker><marker id="m1f5fbf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fbf"/></marker><marker id="me68a00" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#e68a00"/></marker></defs><rect width="720" height="400" fill="#ffffff"/>
<text x="360.0" y="24.0" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Why v&#8321;&#178; and |v&#8321;|&#178; are different for complex numbers</text>
<line x1="110.0" y1="387.0" x2="110.0" y2="54.5" stroke="#e6e6e6" stroke-width="1"/>
<line x1="205.0" y1="387.0" x2="205.0" y2="54.5" stroke="#e6e6e6" stroke-width="1"/>
<line x1="300.0" y1="387.0" x2="300.0" y2="54.5" stroke="#e6e6e6" stroke-width="1"/>
<line x1="395.0" y1="387.0" x2="395.0" y2="54.5" stroke="#e6e6e6" stroke-width="1"/>
<line x1="34.0" y1="330.0" x2="395.0" y2="330.0" stroke="#e6e6e6" stroke-width="1"/>
<line x1="34.0" y1="235.0" x2="395.0" y2="235.0" stroke="#e6e6e6" stroke-width="1"/>
<line x1="34.0" y1="140.0" x2="395.0" y2="140.0" stroke="#e6e6e6" stroke-width="1"/>
<line x1="34.0" y1="330.0" x2="395.0" y2="330.0" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="110.0" y1="387.0" x2="110.0" y2="54.5" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<text x="393.0" y="346.0" font-size="13" fill="#444" text-anchor="end">Re</text>
<text x="118.0" y="64.5" font-size="13" fill="#444" text-anchor="start">Im</text>
<line x1="110.0" y1="330.0" x2="205.0" y2="235.0" stroke="#1f5fbf" stroke-width="3" marker-end="url(#m1f5fbf)"/>
<circle cx="205.0" cy="235.0" r="5" fill="#1f5fbf"/>
<text x="215.0" y="231.0" font-size="14" fill="#1f5fbf" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">z = 1 + i</text>
<text x="165.5" y="304.5" font-size="12" fill="#1f5fbf" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">|z| = &#8730;2</text>
<line x1="110.0" y1="330.0" x2="110.0" y2="140.0" stroke="#e68a00" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#me68a00)"/>
<circle cx="110.0" cy="140.0" r="5" fill="#e68a00"/>
<text x="120.0" y="144.0" font-size="13" fill="#e68a00" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">z&#178; = 2i  (a complex number)</text>
<circle cx="300.0" cy="330.0" r="5" fill="#2e8b2e"/>
<text x="300.0" y="350.0" font-size="13" fill="#2e8b2e" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">|z|&#178; = 2  (a real number)</text>
<rect x="416.0" y="70.0" width="290.0" height="230.0" rx="6" fill="#f4f7fc" stroke="#9ab" stroke-width="1.2"/>
<text x="430.0" y="96.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Take z = 1 + i</text>
<text x="430.0" y="124.0" font-size="13" fill="#e68a00" text-anchor="start" font-weight="bold">z&#178; = (1 + i)&#178;</text>
<text x="430.0" y="144.0" font-size="13" fill="#e68a00" text-anchor="start">   = 1 + 2i + i&#178; = 2i</text>
<text x="430.0" y="174.0" font-size="13" fill="#2e8b2e" text-anchor="start" font-weight="bold">|z|&#178; = 1&#178; + 1&#178; = 2</text>
<text x="430.0" y="208.0" font-size="15" fill="#d62828" text-anchor="start" font-weight="bold">z&#178; &#8800; |z|&#178;</text>
<text x="430.0" y="234.0" font-size="12.5" fill="#222222" text-anchor="start">So the old formula &#931; v&#11388;&#183;v&#11388;</text>
<text x="430.0" y="252.0" font-size="12.5" fill="#222222" text-anchor="start">does not give the length&#178;.</text>
<text x="430.0" y="280.0" font-size="13" fill="#2e8b2e" text-anchor="start" font-weight="bold">Use z&#772;&#183;z = |z|&#178; instead.</text>
</svg>
