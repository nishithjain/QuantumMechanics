<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280" font-family="Arial, Helvetica, sans-serif">
  <title>The complex number 3 + 2i on the complex plane (Argand diagram)</title>
  <defs>
    <marker id="axisArrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="vecArrow2" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 z" fill="#1f5fbf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="440" height="280" fill="#ffffff"/>

  <!-- grid: origin at (60,220), 60 px per unit -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="120" y1="30" x2="120" y2="220"/>
    <line x1="180" y1="30" x2="180" y2="220"/>
    <line x1="240" y1="30" x2="240" y2="220"/>
    <line x1="300" y1="30" x2="300" y2="220"/>
    <line x1="60" y1="160" x2="320" y2="160"/>
    <line x1="60" y1="100" x2="320" y2="100"/>
    <line x1="60" y1="40" x2="320" y2="40"/>
  </g>

  <!-- axes -->
  <line x1="60" y1="220" x2="340" y2="220" stroke="#222" stroke-width="2" marker-end="url(#axisArrow2)"/>
  <line x1="60" y1="220" x2="60" y2="18" stroke="#222" stroke-width="2" marker-end="url(#axisArrow2)"/>
  <text x="346" y="225" font-size="15" fill="#222">Real axis</text>
  <text x="68" y="14" font-size="15" fill="#222">Imaginary axis</text>

  <!-- tick labels -->
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="60" y="238">0</text>
    <text x="120" y="238">1</text>
    <text x="180" y="238">2</text>
    <text x="240" y="238">3</text>
    <text x="300" y="238">4</text>
  </g>
  <g font-size="13" fill="#444" text-anchor="end">
    <text x="50" y="224">0</text>
    <text x="50" y="164">1</text>
    <text x="50" y="104">2</text>
    <text x="50" y="44">3</text>
  </g>

  <!-- dashed projections of the point 3 + 2i = (3, 2) -->
  <g stroke="#e07b00" stroke-width="2" stroke-dasharray="6,5">
    <line x1="240" y1="100" x2="240" y2="220"/>
    <line x1="240" y1="100" x2="60" y2="100"/>
  </g>
  <text x="240" y="262" font-size="14" fill="#e07b00" text-anchor="middle" font-weight="bold">real part = 3</text>
  <text x="68" y="92" font-size="14" fill="#e07b00" font-weight="bold">imaginary part = 2</text>

  <!-- the complex number as an arrow from the origin -->
  <line x1="60" y1="220" x2="240" y2="100" stroke="#1f5fbf" stroke-width="4" marker-end="url(#vecArrow2)"/>
  <circle cx="240" cy="100" r="5" fill="#1f5fbf"/>
  <circle cx="60" cy="220" r="4" fill="#222"/>
  <text x="252" y="92" font-size="16" fill="#1f5fbf" font-weight="bold">3 + 2i = (3, 2)</text>
</svg>
