<text x="188" y="214" font-size="12" fill="#d62828">w = 4i = 4e<tspan dy="-5" font-size="9">i&#960;/2</tspan></text>
<line x1="180" y1="330" x2="105.8" y2="101.7" stroke="#2e8b2e" stroke-width="2.5" marker-end="url(#mG)"/>
<line x1="180" y1="330" x2="161.5" y2="272.9" stroke="#e68a00" stroke-width="4" marker-end="url(#mO)"/>
