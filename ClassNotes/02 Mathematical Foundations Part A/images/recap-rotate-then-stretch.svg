<path d="M222.8,316.1 A45,45 0 0 0 166.1,287.2" fill="none" stroke="#d62828" stroke-width="2" marker-end="url(#mR)"/>
<text x="216" y="262" font-size="12" font-weight="bold" fill="#d62828">rotate by 90&#176;</text>
<text x="246" y="306" font-size="12" font-weight="bold" fill="#1f5fbf">z: length 2, angle 18&#176;</text>
<text x="152" y="276" font-size="12" font-weight="bold" fill="#e68a00" text-anchor="end">iz: length 2,</text>
<text x="152" y="290" font-size="12" font-weight="bold" fill="#e68a00" text-anchor="end">angle 108&#176;</text>
<text x="126" y="190" font-size="12" font-weight="bold" fill="#2e8b2e" text-anchor="end">stretch by 4</text>
<circle cx="105.8" cy="101.7" r="4" fill="#2e8b2e"/>
<text x="95.8" y="97.7" font-size="12" font-weight="bold" fill="#2e8b2e" text-anchor="end">zw: length 8,</text>
<text x="95.8" y="111.7" font-size="12" font-weight="bold" fill="#2e8b2e" text-anchor="end">angle 108&#176;</text>
<text x="230" y="414" font-size="13" fill="#222" text-anchor="middle"><tspan font-weight="bold" fill="#e68a00">Step 1:</tspan> multiply by i. Rotate z by 90&#176; (length stays 2).</text>
<text x="230" y="434" font-size="13" fill="#222" text-anchor="middle"><tspan font-weight="bold" fill="#2e8b2e">Step 2:</tspan> multiply by 4. Stretch by 4 (angle stays 108&#176;).</text>
<text x="230" y="454" font-size="13" fill="#222" text-anchor="middle">Result: length 2 &#215; 4 = 8, angle 18&#176; + 90&#176; = 108&#176; = 3&#960;/5. Grid: 1 square = 1 unit.</text>
