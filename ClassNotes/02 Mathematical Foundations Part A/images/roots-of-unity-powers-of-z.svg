<text x="451.0" y="289.0" font-size="12" fill="#e68a00" text-anchor="start" font-weight="bold">1 = z<tspan dy="-5" font-size="9">10</tspan></text>
<text x="270" y="281" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Start at 1,</text>
<text x="270" y="299" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">turn 36&#176; ten times</text>
<text x="270" y="500" font-size="13" text-anchor="middle" fill="#222">Length: 1 &#215; 1 &#215; ... = 1 (never changes). Angle: 36&#176; + 36&#176; + ... (10 times) = 10 &#215; 36&#176; = 360&#176;.</text>
<text x="270" y="520" font-size="13" text-anchor="middle" fill="#222">A full turn of 360&#176; brings you back to the point 1, so z<tspan dy="-5" font-size="9">10</tspan><tspan dy="5"> = 1.</tspan></text>
<text x="270" y="540" font-size="13" text-anchor="middle" fill="#222">The same works for every one of the 10 points on the previous picture.</text>
