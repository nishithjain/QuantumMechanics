<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="Arial, Helvetica, sans-serif"><defs><marker id="m444" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker><marker id="m1f5fbf" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fbf"/></marker><marker id="me68a00" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#e68a00"/></marker><marker id="me8a0a0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#e8a0a0"/></marker></defs><rect width="660" height="340" fill="#ffffff"/>
<text x="330.0" y="24.0" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Subspace test: the line must pass through the origin</text>
<text x="160.0" y="58.0" font-size="14" fill="#2e8b2e" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Line through the origin: a subspace</text>
<line x1="15.6" y1="205.0" x2="284.4" y2="205.0" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="150.0" y1="294.6" x2="150.0" y2="99.4" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="15.6" y1="272.2" x2="284.4" y2="137.8" stroke="#2e8b2e" stroke-width="3"/>
<line x1="150.0" y1="205.0" x2="214.0" y2="173.0" stroke="#1f5fbf" stroke-width="2.8" marker-end="url(#m1f5fbf)"/>
<line x1="150.0" y1="205.0" x2="246.0" y2="157.0" stroke="#e68a00" stroke-width="2.8" marker-end="url(#me68a00)"/>
<circle cx="246.0" cy="157.0" r="4.5" fill="#e68a00"/>
<circle cx="214.0" cy="173.0" r="4.5" fill="#1f5fbf"/>
<text x="210.0" y="161.0" font-size="14" fill="#1f5fbf" text-anchor="end" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">u</text>
<text x="250.0" y="179.0" font-size="14" fill="#e68a00" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">w</text>
<circle cx="150.0" cy="205.0" r="5" fill="#222222"/>
<text x="158.0" y="223.0" font-size="13" fill="#222222" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">O</text>
<text x="160.0" y="292.0" font-size="12" fill="#222222" text-anchor="middle">u + w and any multiple &#945;u stay on the line</text>
<text x="160.0" y="310.0" font-size="12" fill="#2e8b2e" text-anchor="middle" font-weight="bold">and 0&#183;u = the origin is on the line  &#10003;</text>
<text x="500.0" y="58.0" font-size="14" fill="#d62828" text-anchor="middle" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Shifted line: NOT a subspace</text>
<line x1="365.6" y1="205.0" x2="634.4" y2="205.0" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="500.0" y1="294.6" x2="500.0" y2="99.4" stroke="#444" stroke-width="1.5" marker-end="url(#m444)"/>
<line x1="365.6" y1="224.2" x2="634.4" y2="89.8" stroke="#d62828" stroke-width="3"/>
<line x1="500.0" y1="205.0" x2="564.0" y2="125.0" stroke="#e8a0a0" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#me8a0a0)"/>
<circle cx="564.0" cy="125.0" r="4.5" fill="#d62828"/>
<text x="572.0" y="139.0" font-size="14" fill="#d62828" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">p</text>
<circle cx="500.0" cy="205.0" r="5" fill="#222222"/>
<text x="508.0" y="223.0" font-size="13" fill="#222222" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">O (origin)</text>
<text x="500.0" y="292.0" font-size="12" fill="#222222" text-anchor="middle">Take any point p and multiply by 0: you land on</text>
<text x="500.0" y="310.0" font-size="12" fill="#d62828" text-anchor="middle" font-weight="bold">the origin, but the origin is not on this line  &#10007;</text>
