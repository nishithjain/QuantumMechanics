<text x="248.0" y="138.0" font-size="13" fill="#1f5fbf" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v = (3, 4),  &#8214;v&#8214; = 5</text>
<text x="95.6" y="305.2" font-size="13" fill="#d62828" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">v&#770; = v/&#8214;v&#8214; = (3/5, 4/5), length 1</text>
<text x="400.0" y="90.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">Recipe</text>
<text x="400.0" y="114.0" font-size="13" fill="#222222" text-anchor="start">1. compute the length &#8214;v&#8214;</text>
<text x="400.0" y="134.0" font-size="13" fill="#222222" text-anchor="start">2. multiply every entry by 1/&#8214;v&#8214;</text>
<rect x="388.0" y="160.0" width="290.0" height="110.0" rx="6" fill="#f4f7fc" stroke="#9ab" stroke-width="1.2"/>
<text x="400.0" y="184.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Lecturer's examples</text>
<text x="400.0" y="208.0" font-size="12.5" fill="#222222" text-anchor="start">v = (1, 1 + i):  &#8214;v&#8214; = &#8730;(1 + 2) = &#8730;3</text>
<text x="400.0" y="228.0" font-size="12.5" fill="#222222" text-anchor="start" font-weight="bold">&#8594; v&#770; = (1/&#8730;3)(1, 1 + i)</text>
<text x="400.0" y="252.0" font-size="12.5" fill="#222222" text-anchor="start">(1, &#8722;1):  &#8214;v&#8214; = &#8730;2  &#8594;  (1/&#8730;2)(1, &#8722;1)</text>
<text x="400.0" y="322.0" font-size="13" fill="#d62828" text-anchor="start" font-weight="bold">&#968; = &#945;e&#8321; + &#946;e&#8322; with |&#945;|&#178; + |&#946;|&#178; = 1</text>
<text x="40.0" y="416.0" font-size="11" fill="#777777" text-anchor="start">Real cartoon in R&#178; (v = (3, 4): length is a whole number).</text>
