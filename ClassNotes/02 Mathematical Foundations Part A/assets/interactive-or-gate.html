
<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="qm-embed.css">
<script src="qm-embed-resize.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive OR Gate</title>
<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  padding: 20px;
  color: #263445;
}

.container {
  max-width: 680px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 4px 18px #0001;
}

h2 { color: #1e3a8a; }

.controls {
  display: flex;
  justify-content: center;
  gap: 35px;
  flex-wrap: wrap;
  margin: 25px 0;
}

button {
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  padding: 9px 19px;
  margin: 4px;
  font-size: 17px;
  cursor: pointer;
  background: #f1f5f9;
}

button.selected {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

.diagram {
  width: 100%;
  max-width: 550px;
  margin: 20px auto;
}

svg {
  width: 100%;
  height: auto;
  overflow: visible;
}

.wire {
  stroke: #94a3b8;
  stroke-width: 4;
  fill: none;
  stroke-linecap: round;
}

.wire.active {
  stroke: #16a34a;
}

.gate {
  fill: #dbeafe;
  stroke: #2563eb;
  stroke-width: 3;
}

.signal {
  fill: #16a34a;
  opacity: 0;
}

.signal.active {
  opacity: 1;
}

.signal.animate {
  animation: moveSignal 1.1s linear infinite;
}

@keyframes moveSignal {
  from { transform: translateX(0); }
  to { transform: translateX(70px); }
}

.output-text {
  font-size: 23px;
  font-weight: bold;
  fill: #dc2626;
}

.output-text.on {
  fill: #16a34a;
}

.result {
  padding: 15px;
  background: #f1f5f9;
  border-radius: 10px;
  margin-top: 15px;
  font-size: 19px;
  font-weight: bold;
}

.explanation {
  margin-top: 12px;
  line-height: 1.5;
}

table {
  width: 100%;
  margin-top: 25px;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #cbd5e1;
  padding: 10px;
}

th {
  background: #eaf1ff;
}
</style>
</head>

<body>
<div class="container">

<h2>How an OR Gate Works</h2>
<p>Change the inputs and watch how the output changes.</p>

<div class="controls">
  <div>
    <strong>Input A</strong><br>
    <button type="button" id="a0">0</button>
    <button type="button" id="a1">1</button>
  </div>

  <div>
    <strong>Input B</strong><br>
    <button type="button" id="b0">0</button>
    <button type="button" id="b1">1</button>
  </div>
</div>

<div class="diagram">
<svg viewBox="0 0 550 190">

  <!-- Input wires -->
  <path id="wireA" class="wire"
        d="M 35 55 L 205 55"/>

  <path id="wireB" class="wire"
        d="M 35 135 L 205 135"/>

  <!-- Correct OR gate symbol -->
  <path class="gate"
        d="M 205 25
           Q 255 95 205 165
           Q 330 165 405 95
           Q 330 25 205 25 Z"/>

  <!-- Gate label -->
  <text x="295" y="102"
        text-anchor="middle"
        font-size="25"
        font-weight="bold"
        fill="#1d4ed8">OR</text>

  <!-- Output wire -->
  <path id="wireOut" class="wire"
        d="M 405 95 L 490 95"/>

  <!-- Animated signal dots -->
  <circle id="signalA" class="signal"
          cx="35" cy="55" r="7"/>

  <circle id="signalB" class="signal"
          cx="35" cy="135" r="7"/>

  <circle id="signalOut" class="signal"
          cx="405" cy="95" r="7"/>

  <!-- Labels -->
  <text x="10" y="35" font-size="16">A</text>
  <text x="10" y="115" font-size="16">B</text>
  <text x="495" y="80" font-size="16">Y</text>

  <text id="outputText" class="output-text"
        x="520" y="103">0</text>
</svg>
</div>

<div class="result" id="result">
Output = 0
</div>

<div class="explanation" id="explanation">
Both inputs are 0. Therefore, the output is 0.
</div>

<h3>OR Gate Truth Table</h3>
<table>
<tr>
  <th>Input A</th>
  <th>Input B</th>
  <th>Output Y</th>
</tr>
<tr><td>0</td><td>0</td><td>0</td></tr>
<tr><td>0</td><td>1</td><td>1</td></tr>
<tr><td>1</td><td>0</td><td>1</td></tr>
<tr><td>1</td><td>1</td><td>1</td></tr>
</table>

</div>

<script>
let A = 0;
let B = 0;

function setInput(input, value) {
  if (input === 'A') A = value;
  else B = value;

  const Y = (A || B) ? 1 : 0;

  // Update buttons
  ['a0','a1','b0','b1'].forEach(id =>
    document.getElementById(id).classList.remove('selected')
  );

  document.getElementById('a'+A).classList.add('selected');
  document.getElementById('b'+B).classList.add('selected');

  // Update wires
  document.getElementById('wireA').classList.toggle('active', A === 1);
  document.getElementById('wireB').classList.toggle('active', B === 1);
  document.getElementById('wireOut').classList.toggle('active', Y === 1);

  // Update animated signals
  updateSignal('signalA', A);
  updateSignal('signalB', B);
  updateSignal('signalOut', Y);

  // Update output
  const outputText = document.getElementById('outputText');
  outputText.textContent = Y;
  outputText.classList.toggle('on', Y === 1);

  document.getElementById('result').textContent =
    `Output Y = ${Y}`;

  let message = '';

  if (A === 0 && B === 0) {
    message = 'Both inputs are 0. The OR gate produces 0.';
  } else if (A === 1 && B === 0) {
    message = 'Input A is 1. The OR gate produces 1.';
  } else if (A === 0 && B === 1) {
    message = 'Input B is 1. The OR gate produces 1.';
  } else {
    message = 'Both inputs are 1. The OR gate produces 1.';
  }

  document.getElementById('explanation').textContent = message;
}

function updateSignal(id, active) {
  const signal = document.getElementById(id);

  signal.classList.remove('active', 'animate');

  if (active) {
    signal.classList.add('active', 'animate');
  }
}

document.getElementById("a0").addEventListener("click", () => setInput("A", 0));
document.getElementById("a1").addEventListener("click", () => setInput("A", 1));
document.getElementById("b0").addEventListener("click", () => setInput("B", 0));
document.getElementById("b1").addEventListener("click", () => setInput("B", 1));

setInput("A", 0);
</script>

</body>
</html>
