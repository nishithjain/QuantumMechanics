<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projectors P₀⊗I and P₁⊗I</title>
<style>
:root{--ink:#172b4d;--muted:#526581;--blue:#2455c8;--green:#167548;--line:#d7e0ef;--bg:#eef3fb}
*{box-sizing:border-box}
body{margin:0;padding:22px 12px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:780px;margin:auto}
h2{font-size:15px;font-weight:800;margin:0 0 12px;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.init{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;margin-bottom:14px;font-family:Georgia,serif;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 8px;font-size:17px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:99px;background:#eef3ff;color:var(--blue);margin-bottom:10px}
.keep{color:var(--green);font-weight:700;margin:8px 0}
.rem{color:var(--muted);font-size:14px;margin:4px 0 12px}
.prob{font-size:22px;font-weight:900;color:var(--blue);margin-top:8px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h2>Visualize the two projectors</h2>
  <div class="init">Initial state: (|00⟩ + |01⟩ + |10⟩) / √3</div>
  <div class="grid">
    <section class="card">
      <span class="tag">P₀ ⊗ I</span>
      <h3>Keep first bit 0</h3>
      <p class="keep">00 + 01</p>
      <p class="rem">Removes 10</p>
      <p class="prob">Probability 2/3</p>
    </section>
    <section class="card">
      <span class="tag">P₁ ⊗ I</span>
      <h3>Keep first bit 1</h3>
      <p class="keep">10</p>
      <p class="rem">Removes 00, 01</p>
      <p class="prob">Probability 1/3</p>
    </section>
  </div>
</main>
</body>
</html>
