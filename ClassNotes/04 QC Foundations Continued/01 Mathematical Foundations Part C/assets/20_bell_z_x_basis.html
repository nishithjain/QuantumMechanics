<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bell correlations — Z vs X basis</title>
<style>
:root{--ink:#172b4d;--muted:#526581;--blue:#2455c8;--green:#167548;--line:#d7e0ef;--bg:#eef3fb}
*{box-sizing:border-box}
body{margin:0;padding:22px 12px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
main{max-width:780px;margin:auto}
h2{font-size:14px;font-weight:800;margin:0 0 12px;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 12px;font-size:17px}
.outcome{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;margin:8px 0;border-radius:10px;background:#f4f7fd;font-weight:800}
.pill{font-size:13px;color:var(--blue)}
.footer{margin-top:12px;font-size:13px;color:var(--green);font-weight:700;text-align:center}
.note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5;text-align:center}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h2>Compare measurement bases</h2>
  <div class="grid">
    <section class="card">
      <h3>Computational (Z) basis</h3>
      <div class="outcome"><span>|00⟩</span><span class="pill">50%</span></div>
      <div class="outcome"><span>|11⟩</span><span class="pill">50%</span></div>
      <p class="footer">Both qubits always agree</p>
    </section>
    <section class="card">
      <h3>Hadamard (X) basis</h3>
      <div class="outcome"><span>|++⟩</span><span class="pill">50%</span></div>
      <div class="outcome"><span>|−−⟩</span><span class="pill">50%</span></div>
      <p class="footer">Both qubits always agree</p>
    </section>
  </div>
  <p class="note">|Φ⁺⟩ shows perfect correlations in Z and in X — but that alone does not prove non-classical behavior (see CHSH / Bell tests).</p>
</main>
</body>
</html>
