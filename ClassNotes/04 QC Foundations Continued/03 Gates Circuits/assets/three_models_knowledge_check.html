<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three models — knowledge check</title>
<style>
:root{--ink:#152744;--muted:#465a75;--blue:#214fc2;--ok:#167548;--bad:#b42318;--line:#dce3ef;--bg:#edf2fa}
*{box-sizing:border-box}
body{margin:0;padding:18px 12px;background:var(--bg);font-family:system-ui,sans-serif;color:var(--ink)}
main{max-width:600px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:18px;margin:0 0 4px}
#progress{font-size:13px;color:var(--muted);margin:0 0 14px;font-weight:600}
.q{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.q strong{display:block;margin-bottom:8px}
label{display:block;margin:6px 0;cursor:pointer;font-size:13px;line-height:1.4}
button{margin-top:12px;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
#msg{margin-top:14px;font-size:14px;font-weight:600;min-height:1.2em;line-height:1.45}
</style>
</head>
<body>
<main>
<h1>Knowledge check</h1>
<p id="progress">0 / 5 answered</p>
<div class="q" data-correct="b">
  <strong>1. In the Query model, what do we count?</strong>
  <label><input type="radio" name="q1" value="a"> Number of quantum gates</label>
  <label><input type="radio" name="q1" value="b"> Number of oracle calls</label>
  <label><input type="radio" name="q1" value="c"> Number of qubits</label>
  <label><input type="radio" name="q1" value="d"> Annealing time</label>
</div>
<div class="q" data-correct="c">
  <strong>2. What does circuit depth mean?</strong>
  <label><input type="radio" name="q2" value="a"> Total number of qubits</label>
  <label><input type="radio" name="q2" value="b"> Total number of measurements</label>
  <label><input type="radio" name="q2" value="c"> Number of sequential gate layers</label>
  <label><input type="radio" name="q2" value="d"> Number of oracle calls</label>
</div>
<div class="q" data-correct="c">
  <strong>3. What do we provide to a quantum annealing computer?</strong>
  <label><input type="radio" name="q3" value="a"> A sequence of Hadamard gates</label>
  <label><input type="radio" name="q3" value="b"> An oracle function</label>
  <label><input type="radio" name="q3" value="c"> An energy function</label>
  <label><input type="radio" name="q3" value="d"> A Python program</label>
</div>
<div class="q" data-correct="b">
  <strong>4. Does quantum annealing always guarantee the absolute best solution?</strong>
  <label><input type="radio" name="q4" value="a"> Yes, always</label>
  <label><input type="radio" name="q4" value="b"> No, it is generally heuristic</label>
  <label><input type="radio" name="q4" value="c"> Only when there are two qubits</label>
  <label><input type="radio" name="q4" value="d"> Only when using Hadamard gates</label>
</div>
<div class="q" data-correct="b">
  <strong>5. Does one oracle call mean one quantum gate?</strong>
  <label><input type="radio" name="q5" value="a"> Yes</label>
  <label><input type="radio" name="q5" value="b"> No</label>
</div>
<button type="button" id="check">Check answers</button>
<div id="msg"></div>
</main>
<script>
(function () {
  var total = 5;
  var progress = document.getElementById("progress");
  var msg = document.getElementById("msg");
  function updateProgress() {
    var n = 0;
    for (var i = 1; i <= total; i++) {
      if (document.querySelector('input[name="q' + i + '"]:checked')) n++;
    }
    progress.textContent = n + " / " + total + " answered";
  }
  document.querySelectorAll('input[type="radio"]').forEach(function (el) {
    el.addEventListener("change", updateProgress);
  });
  document.getElementById("check").addEventListener("click", function () {
    var blocks = document.querySelectorAll(".q");
    var correct = 0;
    var answered = 0;
    blocks.forEach(function (block, idx) {
      var name = "q" + (idx + 1);
      var pick = document.querySelector('input[name="' + name + '"]:checked');
      if (!pick) return;
      answered++;
      if (pick.value === block.getAttribute("data-correct")) correct++;
    });
    if (answered < total) {
      msg.style.color = "var(--bad)";
      msg.textContent = "Answer all " + total + " questions before checking.";
      return;
    }
    msg.style.color = correct === total ? "var(--ok)" : "var(--bad)";
    msg.textContent =
      correct === total
        ? "All " + total + " correct. Nice work."
        : correct + " / " + total + " correct. Reread section 2 and try again.";
  });
})();
</script>
</body>
</html>
