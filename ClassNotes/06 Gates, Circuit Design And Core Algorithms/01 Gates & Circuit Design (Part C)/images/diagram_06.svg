<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three CNOT operations alternate control direction to swap two qubits" viewBox="0 0 1000 450" width="1000" height="450"><title>SWAP from exactly three CNOTs</title><desc>Three CNOT operations alternate control direction to swap two qubits</desc><rect width="1000" height="450" fill="#f8faff"/><rect x="0" y="0" width="1000" height="60" fill="#252461"/><text x="28" y="40" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="25" text-anchor="start" font-weight="750" fill="#fff">SWAP from exactly three CNOTs</text><text x="25" y="151" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="750" fill="#15223c">First</text><text x="25" y="292" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="750" fill="#15223c">Second</text><line x1="117" y1="142" x2="933" y2="142" stroke="#b6c4d8" stroke-width="3" stroke-linecap="round" /><line x1="117" y1="285" x2="933" y2="285" stroke="#b6c4d8" stroke-width="3" stroke-linecap="round" /><circle cx="265" cy="142" r="8" fill="#087b84"/><line x1="265" y1="142" x2="265" y2="285" stroke="#087b84" stroke-width="3" stroke-linecap="round" /><circle cx="265" cy="285" r="16" fill="white" stroke="#087b84" stroke-width="3"/><line x1="254" y1="285" x2="276" y2="285" stroke="#087b84" stroke-width="2" stroke-linecap="round" /><line x1="265" y1="274" x2="265" y2="296" stroke="#087b84" stroke-width="2" stroke-linecap="round" /><circle cx="513" cy="285" r="8" fill="#087b84"/><line x1="513" y1="285" x2="513" y2="142" stroke="#087b84" stroke-width="3" stroke-linecap="round" /><circle cx="513" cy="142" r="16" fill="white" stroke="#087b84" stroke-width="3"/><line x1="502" y1="142" x2="524" y2="142" stroke="#087b84" stroke-width="2" stroke-linecap="round" /><line x1="513" y1="131" x2="513" y2="153" stroke="#087b84" stroke-width="2" stroke-linecap="round" /><circle cx="771" cy="142" r="8" fill="#087b84"/><line x1="771" y1="142" x2="771" y2="285" stroke="#087b84" stroke-width="3" stroke-linecap="round" /><circle cx="771" cy="285" r="16" fill="white" stroke="#087b84" stroke-width="3"/><line x1="760" y1="285" x2="782" y2="285" stroke="#087b84" stroke-width="2" stroke-linecap="round" /><line x1="771" y1="274" x2="771" y2="296" stroke="#087b84" stroke-width="2" stroke-linecap="round" /><text x="265" y="353" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="750" fill="#087b84">CX 1</text><text x="513" y="353" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="750" fill="#087b84">CX 2</text><text x="771" y="353" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="750" fill="#087b84">CX 3</text><text x="60" y="411" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="24" text-anchor="start" font-weight="750" fill="#15223c">(a,b)  →  (a,a⊕b)  →  (b,a⊕b)  →  (b,a)</text></svg>