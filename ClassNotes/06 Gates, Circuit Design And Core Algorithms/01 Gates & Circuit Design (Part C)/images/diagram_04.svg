<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rz delta Ry gamma Rz beta temporal order" viewBox="0 0 1000 450" width="1000" height="450"><title>ZYZ: three one-qubit rotations</title><desc>Rz delta Ry gamma Rz beta temporal order</desc><rect width="1000" height="450" fill="#f8faff"/><rect x="0" y="0" width="1000" height="60" fill="#252461"/><text x="28" y="40" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="25" text-anchor="start" font-weight="750" fill="#fff">ZYZ: three one-qubit rotations</text><text x="40" y="105" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="start" font-weight="450" fill="#52637a">Time → (rightmost matrix acts first)</text><line x1="85" y1="235" x2="931" y2="235" stroke="#b6c4d8" stroke-width="3" stroke-linecap="round" /><text x="20" y="240" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="750" fill="#15223c">|ψ⟩</text><rect x="186" y="197" width="165" height="76" rx="12" stroke="#087b84" stroke-width="2.5" fill="#ffffff"/><text x="268.5" y="243.16" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="700" fill="#087b84">Rz(δ)</text><rect x="433" y="197" width="165" height="76" rx="12" stroke="#a85a1a" stroke-width="2.5" fill="#ffffff"/><text x="515.5" y="243.16" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="700" fill="#a85a1a">Ry(γ)</text><rect x="682" y="197" width="165" height="76" rx="12" stroke="#5545b3" stroke-width="2.5" fill="#ffffff"/><text x="764.5" y="243.16" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="700" fill="#5545b3">Rz(β)</text><text x="400" y="150" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="25" text-anchor="middle" font-weight="750" fill="#15223c">ZYZ on a quantum wire</text><text x="65" y="365" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="start" font-weight="750" fill="#5545b3">Matrix:</text><text x="168" y="365" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="450" fill="#15223c">U = exp(iα) · Rz(β) · Ry(γ) · Rz(δ)</text><text x="64" y="411" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="450" fill="#52637a">α = unobservable global phase for an isolated one-qubit gate</text></svg>