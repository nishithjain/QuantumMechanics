<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ideal circuit and random noisy variant compared through pure state fidelity" viewBox="0 0 1000 450" width="1000" height="450"><title>Noise and fidelity: capstone experiment</title><desc>Ideal circuit and random noisy variant compared through pure state fidelity</desc><rect width="1000" height="450" fill="#f8faff"/><rect x="0" y="0" width="1000" height="60" fill="#252461"/><text x="28" y="40" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="25" text-anchor="start" font-weight="750" fill="#fff">Noise and fidelity: capstone experiment</text><rect x="40" y="125" width="291" height="207" rx="12" stroke="#087b84" stroke-width="2.5" fill="#fff"/><text x="185.5" y="234.96" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#087b84"></text><text x="184" y="184" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="750" fill="#087b84">Ideal circuit</text><text x="184" y="249" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="750" fill="#15223c">|ψ ideal⟩</text><line x1="333" y1="222" x2="360" y2="222" stroke="#0c8065" stroke-width="4" stroke-linecap="round" /><text x="342" y="214" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="750" fill="#0c8065">→</text><rect x="363" y="125" width="291" height="207" rx="12" stroke="#a85a1a" stroke-width="2.5" fill="#fff"/><text x="508.5" y="234.96" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#a85a1a"></text><text x="507" y="184" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="750" fill="#a85a1a">Random X/Z faults</text><text x="507" y="249" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="750" fill="#15223c">|ψ noisy⟩</text><line x1="656" y1="222" x2="683" y2="222" stroke="#0c8065" stroke-width="4" stroke-linecap="round" /><text x="665" y="214" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="750" fill="#0c8065">→</text><rect x="686" y="125" width="291" height="207" rx="12" stroke="#5545b3" stroke-width="2.5" fill="#fff"/><text x="831.5" y="234.96" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#5545b3"></text><text x="830" y="184" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="750" fill="#5545b3">Fidelity</text><text x="830" y="249" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="750" fill="#15223c">|⟨ideal|noisy⟩|²</text><text x="56" y="393" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="450" fill="#52637a">Run many seeded noise trials → compute the mean fidelity → sweep error probability.</text></svg>