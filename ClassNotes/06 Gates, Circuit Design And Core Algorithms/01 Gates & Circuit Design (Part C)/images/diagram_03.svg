<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Classical exact NAND, quantum exact local plus CNOT, finite Clifford plus T approximate" viewBox="0 0 1000 450" width="1000" height="450"><title>Three meanings of universality</title><desc>Classical exact NAND, quantum exact local plus CNOT, finite Clifford plus T approximate</desc><rect width="1000" height="450" fill="#f8faff"/><rect x="0" y="0" width="1000" height="60" fill="#252461"/><text x="28" y="40" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="25" text-anchor="start" font-weight="750" fill="#fff">Three meanings of universality</text><rect x="38" y="115" width="300" height="245" rx="12" stroke="#0c8065" stroke-width="2.5" fill="#fff"/><text x="188.0" y="243.96" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#0c8065"></text><text x="188" y="161" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="750" fill="#0c8065">Classical</text><text x="188" y="228" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="750" fill="#15223c">NAND</text><text x="188" y="282" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="500" fill="#15223c">Exact truth tables</text><rect x="366" y="115" width="300" height="245" rx="12" stroke="#087b84" stroke-width="2.5" fill="#fff"/><text x="516.0" y="243.96" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#087b84"></text><text x="516" y="161" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="750" fill="#087b84">Quantum exact</text><text x="516" y="228" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="750" fill="#15223c">All 1-qubit U + CX</text><text x="516" y="282" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="500" fill="#15223c">Any unitary, exactly</text><rect x="694" y="115" width="300" height="245" rx="12" stroke="#5545b3" stroke-width="2.5" fill="#fff"/><text x="844.0" y="243.96" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#5545b3"></text><text x="844" y="161" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="750" fill="#5545b3">Quantum finite</text><text x="844" y="228" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="middle" font-weight="750" fill="#15223c">Clifford + T</text><text x="844" y="282" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="500" fill="#15223c">Arbitrarily close</text><text x="39" y="418" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="start" font-weight="450" fill="#52637a">Continuous quantum angles explain why a finite alphabet uses approximation.</text></svg>