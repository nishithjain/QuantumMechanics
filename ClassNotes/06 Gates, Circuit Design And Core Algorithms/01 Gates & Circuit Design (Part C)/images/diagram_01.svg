<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract quantum circuit, compiler and hardware implementation stages" viewBox="0 0 1000 450" width="1000" height="450"><title>From a circuit to a hardware gate sequence</title><desc>Abstract quantum circuit, compiler and hardware implementation stages</desc><rect width="1000" height="450" fill="#f8faff"/><rect x="0" y="0" width="1000" height="60" fill="#252461"/><text x="28" y="40" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="25" text-anchor="start" font-weight="750" fill="#fff">From a circuit to a hardware gate sequence</text><rect x="38" y="112" width="282" height="242" rx="12" stroke="#5545b3" stroke-width="2.5" fill="#ffffff"/><text x="179.0" y="233.34" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="1" text-anchor="middle" font-weight="700" fill="#5545b3"></text><text x="179" y="163" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="750" fill="#5545b3">Algorithm</text><text x="179" y="202" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="500" fill="#15223c">Abstract gates</text><text x="179" y="253" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="500" fill="#15223c">CCX  CCX  CX</text><text x="179" y="289" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="500" fill="#15223c">CX  CCX   ...</text><line x1="324" y1="231" x2="364" y2="231" stroke="#0c8065" stroke-width="5" stroke-linecap="round" /><text x="338" y="220" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="30" text-anchor="middle" font-weight="750" fill="#0c8065">→</text><rect x="373" y="112" width="282" height="242" rx="12" stroke="#087b84" stroke-width="2.5" fill="#ffffff"/><text x="514.0" y="233.34" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="1" text-anchor="middle" font-weight="700" fill="#087b84"></text><text x="514" y="163" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="750" fill="#087b84">Compiler</text><text x="514" y="202" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="500" fill="#15223c">Decomposition</text><text x="514" y="253" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="500" fill="#15223c">Replace CCX</text><text x="514" y="289" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="500" fill="#15223c">with CX, T, T†, H</text><line x1="659" y1="231" x2="699" y2="231" stroke="#0c8065" stroke-width="5" stroke-linecap="round" /><text x="673" y="220" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="30" text-anchor="middle" font-weight="750" fill="#0c8065">→</text><rect x="708" y="112" width="282" height="242" rx="12" stroke="#a85a1a" stroke-width="2.5" fill="#ffffff"/><text x="849.0" y="233.34" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="1" text-anchor="middle" font-weight="700" fill="#a85a1a"></text><text x="849" y="163" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="750" fill="#a85a1a">Hardware</text><text x="849" y="202" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle" font-weight="500" fill="#15223c">Native pulses</text><text x="849" y="253" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="500" fill="#15223c">Schedule / route</text><text x="849" y="289" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="500" fill="#15223c">calibrate / execute</text><text x="49" y="410" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="start" font-weight="450" fill="#52637a">High-level gate count ≠ compiled physical cost</text></svg>