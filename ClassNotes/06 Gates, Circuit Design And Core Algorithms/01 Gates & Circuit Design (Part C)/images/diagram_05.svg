<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ABC sequence on target with two CNOTs and phase gate on control" viewBox="0 0 1000 450" width="1000" height="450"><title>ABC trick: build any controlled-U</title><desc>ABC sequence on target with two CNOTs and phase gate on control</desc><rect width="1000" height="450" fill="#f8faff"/><rect x="0" y="0" width="1000" height="60" fill="#252461"/><text x="28" y="40" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="25" text-anchor="start" font-weight="750" fill="#fff">ABC trick: build any controlled-U</text><text x="30" y="126" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="750" fill="#15223c">Control</text><text x="31" y="295" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="750" fill="#15223c">Target</text><line x1="145" y1="117" x2="957" y2="117" stroke="#b6c4d8" stroke-width="3" stroke-linecap="round" /><line x1="145" y1="281" x2="957" y2="281" stroke="#b6c4d8" stroke-width="3" stroke-linecap="round" /><rect x="186" y="247" width="74" height="65" rx="12" stroke="#5545b3" stroke-width="2.5" fill="#ffffff"/><text x="223.0" y="287.66" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="700" fill="#5545b3">C</text><rect x="498" y="247" width="74" height="65" rx="12" stroke="#087b84" stroke-width="2.5" fill="#ffffff"/><text x="535.0" y="287.66" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="700" fill="#087b84">B</text><rect x="820" y="247" width="74" height="65" rx="12" stroke="#5545b3" stroke-width="2.5" fill="#ffffff"/><text x="857.0" y="287.66" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="24" text-anchor="middle" font-weight="700" fill="#5545b3">A</text><circle cx="370" cy="117" r="9" fill="#a85a1a"/><line x1="370" y1="117" x2="370" y2="281" stroke="#a85a1a" stroke-width="