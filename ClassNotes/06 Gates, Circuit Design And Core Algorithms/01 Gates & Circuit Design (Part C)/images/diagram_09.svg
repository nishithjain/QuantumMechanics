<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NISQ physical gate cost and fault tolerant logical magic state cost models" viewBox="0 0 1000 450" width="1000" height="450"><title>Two hardware types, two cost models</title><desc>NISQ physical gate cost and fault tolerant logical magic state cost models</desc><rect width="1000" height="450" fill="#f8faff"/><rect x="0" y="0" width="1000" height="60" fill="#252461"/><text x="28" y="40" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="25" text-anchor="start" font-weight="750" fill="#fff">Two hardware types, two cost models</text><rect x="40" y="102" width="444" height="285" rx="12" stroke="#087b84" stroke-width="2.5" fill="#fff"/><text x="262.0" y="250.96" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#087b84"></text><text x="262" y="154" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="750" fill="#087b84">NISQ physical chip</text><text x="70" y="226" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="450" fill="#15223c">Cost driver: Two-qubit errors</text><text x="70" y="270" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="start" font-weight="750" fill="#15223c">CNOT count / depth</text><text x="70" y="321" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="450" fill="#52637a">Also: SWAP routing</text><rect x="527" y="102" width="444" height="285" rx="12" stroke="#a85a1a" stroke-width="2.5" fill="#fff"/><text x="749.0" y="250.96" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" font-weight="700" fill="#a85a1a"></text><text x="749" y="154" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="750" fill="#a85a1a">Fault-tolerant logical</text><text x="557" y="226" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="450" fill="#15223c">Cost driver: Magic-state production</text><text x="557" y="270" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="start" font-weight="750" fill="#15223c">T-count / T-depth</text><text x="557" y="321" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="450" fill="#52637a">Also: Logical qubit cost</text><text x="55" y="426" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="450" fill="#52637a">The same logical circuit can have a very different physical resource cost.</text></svg>