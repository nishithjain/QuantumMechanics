<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bloch sphere with six single qubit Clifford axis states" viewBox="0 0 1000 450" width="1000" height="450"><title>Bloch-sphere reference states</title><desc>Bloch sphere with six single qubit Clifford axis states</desc><rect width="1000" height="450" fill="#f8faff"/><rect x="0" y="0" width="1000" height="60" fill="#252461"/><text x="28" y="40" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="25" text-anchor="start" font-weight="750" fill="#fff">Bloch-sphere reference states</text><ellipse cx="368" cy="248" rx="164" ry="165" fill="#fff" stroke="#aab9ce" stroke-width="3"/><ellipse cx="368" cy="248" rx="164" ry="45" fill="none" stroke="#b3c5da" stroke-dasharray="7 7" stroke-width="2"/><line x1="368" y1="420" x2="368" y2="85" stroke="#52637a" stroke-width="2" stroke-linecap="round" /><line x1="191" y1="269" x2="542" y2="229" stroke="#52637a" stroke-width="2" stroke-linecap="round" /><line x1="289" y1="312" x2="445" y2="175" stroke="#52637a" stroke-width="2" stroke-linecap="round" /><text x="367" y="86" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="750" fill="#5545b3">|0⟩</text><text x="365" y="431" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="750" fill="#5545b3">|1⟩</text><text x="553" y="232" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="750" fill="#087b84">|+⟩</text><text x="174" y="279" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="750" fill="#087b84">|−⟩</text><text x="455" y="166" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="750" fill="#a85a1a">|+i⟩</text><text x="275" y="328" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="start" font-weight="750" fill="#a85a1a">|−i⟩</text><rect x="656" y="125" width="280" height="60" rx="12" stroke="#5545b3" stroke-width="2.5" fill="#ffffff"/><text x="796.0" y="162.14" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="700" fill="#5545b3">Six Clifford directions</text><text x="669" y="229" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="start" font-weight="450" fill="#15223c">±X, ±Y and ±Z axes</text><text x="669" y="272" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="start" font-weight="450" fill="#15223c">Pure qubit states live</text><text x="669" y="308" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="start" font-weight="450" fill="#15223c">on the sphere surface.</text><text x="669" y="360" font-family="DejaVu Sans,Segoe UI,Arial,sans-serif" font-size="20" text-anchor="start" font-weight="750" fill="#0c8065">Mixed states: inside.</text></svg>