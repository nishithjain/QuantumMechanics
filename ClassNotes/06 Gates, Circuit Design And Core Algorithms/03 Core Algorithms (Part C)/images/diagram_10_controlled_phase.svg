<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Controlled phase rotation CRⱼ">
<rect width="960" height="540" fill="#fcfdff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#087f8c"/></marker></defs>
<text x="34" y="47" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172554">Controlled phase rotation CRⱼ</text>
<text x="36" y="77" font-family="Arial, sans-serif" font-size="15" fill="#4b647d">The only changed computational basis vector is |11⟩: it acquires the phase e^(2πi/2ʲ).</text>
<path d="M34 89H925" stroke="#d5e1ee" stroke-width="1.5"/>
<line x1="75" y1="180" x2="545" y2="180" stroke="#4b647d" stroke-width="3" />
<line x1="75" y1="281" x2="545" y2="281" stroke="#4b647d" stroke-width="3" />
<text x="67" y="172" font-family="Arial, sans-serif" text-anchor="end" font-size="16" font-weight="700" fill="#172554">control</text>
<text x="67" y="274" font-family="Arial, sans-serif" text-anchor="end" font-size="16" font-weight="700" fill="#172554">target</text>
<circle cx="301" cy="180" r="10" fill="#172554" stroke="#172554" stroke-width="1"/>
<line x1="301" y1="180" x2="301" y2="281" stroke="#172554" stroke-width="3" />
<rect x="263" y="250" width="78" height="60" rx="8" fill="#ddf4f3" stroke="#087f8c" stroke-width="1.2"/>
<text x="302" y="290" font-family="Arial, sans-serif" text-anchor="middle" font-size="24" font-weight="700" fill="#087f8c">Rⱼ</text>
<rect x="610" y="148" width="302" height="246" rx="12" fill="#f4f7fc" stroke="#d5e1ee" stroke-width="1.2"/>
<text x="645" y="196" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="400" fill="#172554">|00⟩ → |00⟩</text>
<text x="645" y="246" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="400" fill="#172554">|01⟩ → |01⟩</text>
<text x="645" y="296" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="400" fill="#172554">|10⟩ → |10⟩</text>
<text x="645" y="346" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#d26a20">|11⟩ → e^(iθ)|11⟩</text>
<text x="480" y="488" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#4b647d">θ = 2π / 2ʲ. Examples: R₁ = Z, R₂ = S, R₃ = T.</text>
</svg>