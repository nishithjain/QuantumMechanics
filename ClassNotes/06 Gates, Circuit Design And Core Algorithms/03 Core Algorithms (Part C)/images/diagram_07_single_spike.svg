<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="A single Fourier spike spreads uniformly">
<rect width="960" height="540" fill="#fcfdff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#087f8c"/></marker></defs>
<text x="34" y="47" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172554">A single Fourier spike spreads uniformly</text>
<text x="36" y="77" font-family="Arial, sans-serif" font-size="15" fill="#4b647d">For a basis input |3⟩, every output probability is 1/8; the phases are not identical.</text>
<path d="M34 89H925" stroke="#d5e1ee" stroke-width="1.5"/>
<text x="60" y="176" font-family="Arial, sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#172554">Input: one certain outcome</text>
