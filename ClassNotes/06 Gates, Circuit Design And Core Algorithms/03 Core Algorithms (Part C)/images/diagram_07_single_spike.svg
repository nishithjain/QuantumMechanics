<text x="91" y="401" font-family="Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="400" fill="#4b647d">0</text>
<text x="132" y="401" font-family="Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="400" fill="#4b647d">1</text>
<text x="173" y="401" font-family="Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="400" fill="#4b647d">2</text>
<rect x="194" y="228" width="35" height="152" rx="2" fill="#d26a20" stroke="none" stroke-width="1.2"/>
<text x="214" y="401" font-family="Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="400" fill="#4b647d">3</text>
<text x="256" y="401" font-family="Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="400" fill="#4b647d">4</text>
<text x="297" y="401" font-family="Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="400" fill="#4b647d">5</text>
<text x="338" y="401" font-family="Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="400" fill="#4b647d">6</text>
<text x="379" y="401" font-family="Arial, sans-serif" text-anchor="middle" font-size="13" font-weight="400" fill="#4b647d">7</text>
<text x="235.0" y="432" font-family="Arial, sans-serif" text-anchor="middle" font-size="14" font-weight="400" fill="#4b647d">Before F₈</text>
<line x1="424" y1="283" x2="534" y2="283" stroke="#087f8c" stroke-width="3" marker-end="url(#a)" />
<text x="480" y="261" font-family="Arial, sans-serif" text-anchor="middle" font-size="22" font-weight="700" fill="#087f8c">F₈</text>
<text x="548" y="176" font-family="Arial, sans-serif" text-anchor="start" font-size="19" font-weight="700" fill="#172554">Output: eight equally likely outcomes</text>
<line x1="548" y1="380" x2="898" y2="380" stroke="#8da8b4" stroke-width="2" />
<rect x="558" y="361" width="35" height="19" rx="2" fill="#087f8c" stroke="none" stroke-width="1.2"/>
