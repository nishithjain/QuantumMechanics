<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Modular arithmetic: the 8-position clock">
<rect width="960" height="540" fill="#fcfdff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#087f8c"/></marker></defs>
<text x="34" y="47" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172554">Modular arithmetic: the 8-position clock</text>
<text x="36" y="77" font-family="Arial, sans-serif" font-size="15" fill="#4b647d">Modulo 8 wraps after 7.  Example: 6 + 5 = 11 ≡ 3 (mod 8).</text>
<path d="M34 89H925" stroke="#d5e1ee" stroke-width="1.5"/>
<circle cx="365" cy="315" r="158" fill="#f4fafc" stroke="#c9dce9" stroke-width="2"/>
<circle cx="365" cy="157" r="25" fill="#fff" stroke="#b6cad8" stroke-width="2"/>
<text x="365" y="163" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#172554">0</text>
<circle cx="477" cy="203" r="25" fill="#fff" stroke="#b6cad8" stroke-width="2"/>
<text x="477" y="209" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#172554">1</text>
<circle cx="523" cy="315" r="25" fill="#fff" stroke="#b6cad8" stroke-width="2"/>
<text x="523" y="321" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#172554">2</text>
<circle cx="477" cy="427" r="25" fill="#ffe6c6" stroke="#d26a20" stroke-width="2"/>
<text x="477" y="433" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#172554">3</text>
<circle cx="365" cy="473" r="25" fill="#fff" stroke="#b6cad8" stroke-width="2"/>
<text x="365" y="479" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#172554">4</text>
<circle cx="253" cy="427" r="25" fill="#fff" stroke="#b6cad8" stroke-width="2"/>
<text x="253" y="433" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#172554">5</text>
<circle cx="207" cy="315" r="25" fill="#d3f0ef" stroke="#087f8c" stroke-width="2"/>
<text x="207" y="321" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#172554">6</text>
<circle cx="253" cy="203" r="25" fill="#fff" stroke="#b6cad8" stroke-width="2"/>
<text x="253" y="209" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#172554">7</text>
<text x="642" y="216" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#087f8c">Start at 6</text>
<text x="642" y="265" font-family="Arial, sans-serif" text-anchor="start" font-size="20" font-weight="400" fill="#172554">Advance five steps</text>
<text x="642" y="309" font-family="Arial, sans-serif" text-anchor="start" font-size="18" font-weight="400" fill="#172554">6 → 7 → 0 → 1 → 2 → 3</text>
<text x="642" y="356" font-family="Arial, sans-serif" text-anchor="start" font-size="24" font-weight="700" fill="#d26a20">Answer: 3</text>
</svg>