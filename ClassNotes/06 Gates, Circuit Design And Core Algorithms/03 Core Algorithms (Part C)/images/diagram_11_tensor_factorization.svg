<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="QFT of a basis state factors into one-qubit states">
<rect width="960" height="540" fill="#fcfdff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#087f8c"/></marker></defs>
<text x="34" y="47" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172554">QFT of a basis state factors into one-qubit states</text>
<text x="36" y="77" font-family="Arial, sans-serif" font-size="15" fill="#4b647d">Example N = 8, x = 5: three output-bit factors with phase denominators 2, 4 and 8.</text>
<path d="M34 89H925" stroke="#d5e1ee" stroke-width="1.5"/>
<rect x="46" y="170" width="225" height="218" rx="12" fill="#f3f7fb" stroke="#d5e1ee" stroke-width="1.2"/>
<text x="158" y="214" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="700" fill="#172554">Original input</text>
<text x="158" y="270" font-family="Arial, sans-serif" text-anchor="middle" font-size="27" font-weight="700" fill="#087f8c">|x⟩ = |101⟩</text>
<text x="158" y="330" font-family="Arial, sans-serif" text-anchor="middle" font-size="22" font-weight="400" fill="#4b647d">x = 5</text>
<line x1="274" y1="270" x2="354" y2="270" stroke="#087f8c" stroke-width="3" marker-end="url(#a)" />
<text x="314" y="240" font-family="Arial, sans-serif" text-anchor="middle" font-size="20" font-weight="700" fill="#087f8c">F₈</text>
<rect x="377" y="129" width="520" height="92" rx="12" fill="#ecf8f6" stroke="#d5e1ee" stroke-width="1.2"/>
<text x="410" y="158" font-family="Arial, sans-serif" text-anchor="start" font-size="17" font-weight="700" fill="#4b647d">factor 0</text>
<text x="410" y="195" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#172554">(|0⟩ − |1⟩) / √2</text>
<rect x="377" y="239" width="520" height="92" rx="12" fill="#f4eefc" stroke="#d5e1ee" stroke-width="1.2"/>
<text x="410" y="268" font-family="Arial, sans-serif" text-anchor="start" font-size="17" font-weight="700" fill="#4b647d">factor 1</text>
<text x="410" y="305" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#172554">(|0⟩ + i|1⟩) / √2</text>
<rect x="377" y="349" width="520" height="92" rx="12" fill="#ecf8f6" stroke="#d5e1ee" stroke-width="1.2"/>
<text x="410" y="378" font-family="Arial, sans-serif" text-anchor="start" font-size="17" font-weight="700" fill="#4b647d">factor 2</text>
<text x="410" y="415" font-family="Arial, sans-serif" text-anchor="start" font-size="22" font-weight="700" fill="#172554">(|0⟩ + e^(i5π/4)|1⟩) / √2</text>
<text x="480" y="492" font-family="Arial, sans-serif" text-anchor="middle" font-size="17" font-weight="700" fill="#d26a20">Three normalized factors expand into 8 amplitudes — exactly the F₈ column for input 5.</text>
</svg>