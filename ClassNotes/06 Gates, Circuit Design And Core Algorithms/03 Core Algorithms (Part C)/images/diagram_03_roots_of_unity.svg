<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="The eighth roots of unity">
<rect width="960" height="540" fill="#fcfdff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#087f8c"/></marker></defs>
<text x="34" y="47" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#172554">The eighth roots of unity</text>
<text x="36" y="77" font-family="Arial, sans-serif" font-size="15" fill="#4b647d">Eight phase arrows of length 1, separated by 45 degrees (π/4).</text>
<path d="M34 89H925" stroke="#d5e1ee" stroke-width="1.5"/>
<line x1="98" y1="319" x2="516" y2="319" stroke="#9db0c4" stroke-width="1.5" />
<line x1="307" y1="528" x2="307" y2="110" stroke="#9db0c4" stroke-width="1.5" />
<circle cx="307" cy="319" r="172" fill="none" stroke="#b9ccd7" stroke-width="1.5"/>
<line x1="307" y1="319" x2="479" y2="319" stroke="#b0bfcb" stroke-width="2" />
<circle cx="479" cy="319" r="6" fill="#087f8c" stroke="#fff" stroke-width="1"/>
<text x="514" y="325" font-family="Arial, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">1</text>
<line x1="307" y1="319" x2="429" y2="197" stroke="#d26a20" stroke-width="2" />
<circle cx="429" cy="197" r="6" fill="#d26a20" stroke="#fff" stroke-width="1"/>
<text x="453" y="179" font-family="Arial, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">ω</text>
<line x1="307" y1="319" x2="307" y2="147" stroke="#b0bfcb" stroke-width="2" />
<circle cx="307" cy="147" r="6" fill="#087f8c" stroke="#fff" stroke-width="1"/>
<text x="307" y="118" font-family="Arial, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">ω^2</text>
<line x1="307" y1="319" x2="185" y2="197" stroke="#b0bfcb" stroke-width="2" />
<circle cx="185" cy="197" r="6" fill="#087f8c" stroke="#fff" stroke-width="1"/>
<text x="161" y="179" font-family="Arial, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">ω^3</text>
<line x1="307" y1="319" x2="135" y2="319" stroke="#b0bfcb" stroke-width="2" />
<circle cx="135" cy="319" r="6" fill="#087f8c" stroke="#fff" stroke-width="1"/>
<text x="100" y="325" font-family="Arial, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">ω⁴ = −1</text>
<line x1="307" y1="319" x2="185" y2="441" stroke="#b0bfcb" stroke-width="2" />
<circle cx="185" cy="441" r="6" fill="#087f8c" stroke="#fff" stroke-width="1"/>
<text x="161" y="471" font-family="Arial, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">ω^5</text>
<line x1="307" y1="319" x2="307" y2="491" stroke="#b0bfcb" stroke-width="2" />
<circle cx="307" cy="491" r="6" fill="#087f8c" stroke="#fff" stroke-width="1"/>
<text x="307" y="532" font-family="Arial, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">ω^6</text>
<line x1="307" y1="319" x2="429" y2="441" stroke="#b0bfcb" stroke-width="2" />
<circle cx="429" cy="441" r="6" fill="#087f8c" stroke="#fff" stroke-width="1"/>
<text x="453" y="471" font-family="Arial, sans-serif" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">ω^7</text>
<rect x="615" y="173" width="306" height="236" rx="12" fill="#eef7f6" stroke="#d5e1ee" stroke-width="1.2"/>
<text x="636" y="223" font-family="Arial, sans-serif" text-anchor="start" font-size="24" font-weight="700" fill="#087f8c">ω = e^(iπ/4)</text>
<text x="636" y="275" font-family="Arial, sans-serif" text-anchor="start" font-size="21" font-weight="400" fill="#172554">ω² = i</text>
<text x="636" y="316" font-family="Arial, sans-serif" text-anchor="start" font-size="21" font-weight="400" fill="#172554">ω⁴ = −1</text>
<text x="636" y="357" font-family="Arial, sans-serif" text-anchor="start" font-size="21" font-weight="400" fill="#172554">ω⁸ = 1</text>
<text x="480" y="482" font-family="Arial, sans-serif" text-anchor="middle" font-size="19" font-weight="700" fill="#d26a20">Vector sum: 1 + ω + ω² + ··· + ω⁷ = 0</text>
</svg>