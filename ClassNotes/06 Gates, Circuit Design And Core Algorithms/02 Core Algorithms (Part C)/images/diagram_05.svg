<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 390" role="img" aria-label="Classical post-processing · keep only independent clues"><rect width="1000" height="390" rx="18" fill="#fbfcff"/><rect width="1000" height="9" fill="#2745a9"/><text x="32" y="53" fill="#1c2741" font-size="27" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">Classical post-processing · keep only independent clues</text><text x="38" y="101" fill="#2745a9" font-size="20" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">Measured z rows</text><rect x="42" y="128" width="280" height="46" rx="9" fill="#f0f4ff" stroke="#e8edfa" stroke-width="2"/><text x="180" y="159" fill="#1c2741" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif">0 0 1</text><rect x="42" y="181" width="280" height="46" rx="9" fill="#f0f4ff" stroke="#e8edfa" stroke-width="2"/><text x="180" y="212" fill="#1c2741" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif">1 1 0</text><rect x="42" y="234" width="280" height="46" rx="9" fill="#f0f4ff" stroke="#e8edfa" stroke-width="2"/><text x="180" y="265" fill="#1c2741" font-size="20" font-weight="bold" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif">1 1 1</text><line x1="340" y1="206" x2="500" y2="206" stroke="#087f8c" stroke-width="3" stroke-linecap="round"/><path d="M 489.2 211.2 L 500 206 L 489.2 200.8" stroke="#087f8c" stroke-width="3" fill="none" stroke-linejoin="round"/><rect x="531" y="99" width="415" height="198" rx="12" fill="#ecf7f3" stroke="#e8edfa" stroke-width="2"/><text x="561" y="135" fill="#1c7a54" font-size="21" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">Independent equations</text><text x="558" y="177" fill="#1c2741" font-size="23" font-weight="normal" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">s₃ = 0</text><text x="558" y="218" fill="#1c2741" font-size="23" font-weight="normal" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">s₁  XOR  s₂ = 0</text><text x="558" y="263" fill="#1c7a54" font-size="21" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">Secret s = 110  (nonzero)</text><text x="500" y="340" fill="#5e6c85" font-size="17" font-weight="normal" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif">Third row = first row XOR second row; therefore it adds no new information.</text></svg>