<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 380" role="img" aria-label="Hadamard transform · equal magnitudes, patterned signs"><rect width="1000" height="380" rx="18" fill="#fbfcff"/><rect width="1000" height="9" fill="#2745a9"/><text x="32" y="53" fill="#1c2741" font-size="27" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">Hadamard transform · equal magnitudes, patterned signs</text><rect x="32" y="85" width="330" height="240" rx="12" fill="white" stroke="#e8edfa" stroke-width="2"/><text x="57" y="123" fill="#2745a9" font-size="23" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">Start with |10&gt;</text><text x="57" y="173" fill="#1c2741" font-size="19" font-weight="normal" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">H on each qubit</text><text x="57" y="215" fill="#087f8c" font-size="24" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">|−&gt; ^ |+&gt;</text><text x="57" y="267" fill="#5e6c85" font-size="16" font-weight="normal" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">Each term has |amplitude| = 1/2</text><line x1="371" y1="205" x2="465" y2="205" stroke="#2745a9" stroke-width="3" stroke-linecap="round"/><path d="M 454.2 210.2 L 465 205 L 454.2 199.8" stroke="#2745a9" stroke-width="3" fill="none" stroke-linejoin="round"/><rect x="497" y="100" width="205" height="83" rx="12" fill="#f0f4ff" stroke="#e8edfa" stroke-width="2"/><text x="521" y="135" fill="#1c2741" font-size="20" font-weight="normal" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">|00&gt;</text><text x="604" y="156" fill="#087f8c" font-size="22" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">+1/2</text><rect x="722" y="100" width="205" height="83" rx="12" fill="#f0f4ff" stroke="#e8edfa" stroke-width="2"/><text x="746" y="135" fill="#1c2741" font-size="20" font-weight="normal" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">|01&gt;</text><text x="829" y="156" fill="#087f8c" font-size="22" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">+1/2</text><rect x="497" y="206" width="205" height="83" rx="12" fill="#fff2f0" stroke="#e8edfa" stroke-width="2"/><text x="521" y="241" fill="#1c2741" font-size="20" font-weight="normal" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">|10&gt;</text><text x="604" y="262" fill="#b35438" font-size="22" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">−1/2</text><rect x="722" y="206" width="205" height="83" rx="12" fill="#fff2f0" stroke="#e8edfa" stroke-width="2"/><text x="746" y="241" fill="#1c2741" font-size="20" font-weight="normal" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">|11&gt;</text><text x="829" y="262" fill="#b35438" font-size="22" font-weight="bold" text-anchor="start" font-family="Arial, DejaVu Sans, sans-serif">−1/2</text><text x="500" y="352" fill="#5e6c85" font-size="16" font-weight="normal" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif">Probability = amplitude² = 1/4 for every outcome; the signs matter later.</text></svg>