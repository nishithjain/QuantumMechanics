<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parity sum S(a) — check your understanding</title>
<link rel="stylesheet" href="embed-frame.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #fff; }
  body { font-family: Arial, sans-serif; color: #202938; padding: 4px 8px 6px; line-height: 1.4; background: #fff; }
  .quiz-container { padding: 4px 2px 2px; }
  .question { border-top: 1px solid #e8ebf0; padding: 8px 0 6px; }
  .question:first-of-type { border-top: none; padding-top: 0; }
  h3 { font-size: 13px; font-weight: 700; margin: 0 0 5px; line-height: 1.35; }
  .option {
    display: block; padding: 5px 7px; margin: 3px 0;
    background: #f6f7fb; border-radius: 5px; cursor: pointer; font-size: 12px; line-height: 1.35;
  }
  .option:hover { background: #ebeffa; }
  .option input { margin-right: 5px; vertical-align: -1px; }
  .quiz-actions { margin-top: 6px; }
  button {
    background: #245bb5; color: white; border: none; padding: 7px 14px;
    border-radius: 6px; cursor: pointer; margin: 0 6px 0 0; font-size: 12px;
  }
  .feedback { display: none; padding: 6px 7px; margin-top: 4px; border-radius: 5px; font-size: 11px; line-height: 1.4; }
  .correct { background: #e0f5e8; color: #176b39; }
  .incorrect { background: #fde8e8; color: #a12828; }
  .score { font-size: 14px; font-weight: bold; margin-top: 6px; }
  .score:empty { display: none; }
</style>
</head>
<body>
<div class="quiz-container">
  <div id="quiz-form"></div>
  <div class="quiz-actions">
    <button type="button" id="submit">Check my answers</button>
    <button type="button" id="retry" style="display:none">Try again</button>
  </div>
  <div class="score" id="score"></div>
</div>
<script>
const questions = [
  {
    q: "What does (−1)^(a·x) do?",
    options: [
      "Converts the dot product 0 or 1 into +1 or −1",
      "Creates a new input bit",
      "Multiplies a and x as ordinary numbers"
    ],
    answer: 0,
    explanation: "Exponent 0 → +1; exponent 1 → −1."
  },
  {
    q: "If a = 11 and x = 10, what is a·x?",
    options: ["0", "1", "2"],
    answer: 1,
    explanation: "(1×1) ⊕ (1×0) = 1 ⊕ 0 = 1."
  },
  {
    q: "If a = 00, what sign does every input produce?",
    options: ["−1", "Sometimes +1 and sometimes −1", "+1"],
    answer: 2,
    explanation: "Zero mask → a·x = 0 always → (−1)⁰ = +1."
  },
  {
    q: "For a = 10, signs for x = 00, 01, 10, 11?",
    options: ["+ + − −", "+ − + −", "+ − − +"],
    answer: 0,
    explanation: "Only x₁ matters: +, +, −, −."
  },
  {
    q: "Why does every non-zero mask give S(a) = 0?",
    options: [
      "No positive signs exist",
      "Inputs pair with opposite-sign partners",
      "Every input is identical"
    ],
    answer: 1,
    explanation: "Flip a selected bit to toggle a·x and reverse the sign."
  },
  {
    q: "What is destructive interference?",
    options: [
      "Same signs reinforce each other",
      "Opposite-sign contributions cancel",
      "A qubit becomes a classical bit"
    ],
    answer: 1,
    explanation: "+ and − amplitudes can cancel when combined."
  }
];
function scheduleFit() { if (window.qmEmbedFitSchedule) window.qmEmbedFitSchedule(); }
const form = document.getElementById("quiz-form");
const feedbacks = [];
questions.forEach((q, qi) => {
  const div = document.createElement("div");
  div.className = "question";
  const title = document.createElement("h3");
  title.textContent = `${qi + 1}. ${q.q}`;
  div.appendChild(title);
  q.options.forEach((option, oi) => {
    const label = document.createElement("label");
    label.className = "option";
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = `q${qi}`;
    radio.value = oi;
    label.appendChild(radio);
    label.append(option);
    div.appendChild(label);
  });
  const feedback = document.createElement("div");
  feedback.className = "feedback";
  div.appendChild(feedback);
  feedbacks.push(feedback);
  form.appendChild(div);
});
const submit = document.getElementById("submit");
const retry = document.getElementById("retry");
const scoreEl = document.getElementById("score");
submit.onclick = () => {
  let score = 0;
  questions.forEach((q, qi) => {
    const selected = form.querySelector(`input[name="q${qi}"]:checked`);
    const feedback = feedbacks[qi];
    if (!selected) {
      feedback.className = "feedback incorrect";
      feedback.textContent = "Pick an option.";
      feedback.style.display = "block";
      return;
    }
    const correct = Number(selected.value) === q.answer;
    if (correct) score++;
    feedback.className = "feedback " + (correct ? "correct" : "incorrect");
    feedback.textContent = (correct ? "Correct! " : "Correct answer: " + q.options[q.answer] + ". ") + q.explanation;
    feedback.style.display = "block";
  });
  scoreEl.textContent = `Your score: ${score} / ${questions.length}`;
  submit.style.display = "none";
  retry.style.display = "inline-block";
  form.querySelectorAll("input").forEach((i) => { i.disabled = true; });
  scheduleFit();
};
retry.onclick = () => {
  form.querySelectorAll("input").forEach((i) => { i.checked = false; i.disabled = false; });
  feedbacks.forEach((f) => { f.style.display = "none"; });
  scoreEl.textContent = "";
  submit.style.display = "inline-block";
  retry.style.display = "none";
  scheduleFit();
};
scheduleFit();
</script>
<script src="embed-fit.js"></script>
</body>
</html>
