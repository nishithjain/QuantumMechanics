<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oracle f(x)=1⊕x</title>
<link rel="stylesheet" href="oracle-one-bit-card-styles.css">
</head>
<body>
<div class="card">
  <h3>Example D — f(x) = 1 ⊕ x</h3>
  <div class="meaning">The function returns the opposite of x</div>
  <div class="circuit">
    <svg viewBox="0 0 340 115" role="img" aria-label="CNOT followed by X on target">
      <text class="wire-label" x="28" y="35">x</text>
      <text class="wire-label" x="28" y="78">y</text>
      <line class="wire" x1="55" y1="35" x2="315" y2="35"/>
      <line class="wire" x1="55" y1="78" x2="315" y2="78"/>
      <line class="wire" x1="135" y1="35" x2="135" y2="78"/>
      <circle class="control" cx="135" cy="35" r="6"/>
      <circle class="plus-circle" cx="135" cy="78" r="12"/>
      <line class="wire" x1="135" y1="69" x2="135" y2="87"/>
      <line class="wire" x1="126" y1="78" x2="144" y2="78"/>
      <rect class="gate" x="220" y="55" width="46" height="46"/>
      <text class="gate-text" x="243" y="78">X</text>
    </svg>
    <div class="circuit-caption">CNOT, then flip y</div>
  </div>
  <div class="explanation">
    <strong>What happens?</strong><br>
    First, CNOT XORs x into y. Then the X gate flips y once more. Together, they XOR x and 1 into the target.
  </div>
  <div class="formula">y → y ⊕ x ⊕ 1</div>
</div>
<script src="embed-fit.js"></script>
</body>
</html>
