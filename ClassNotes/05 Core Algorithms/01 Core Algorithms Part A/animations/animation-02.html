<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build a parity oracle with CNOTs</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:20px auto;padding:0 15px;background:#f7f9fc;color:#172238}main{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:22px}h1{font-size:1.5rem}button,select,input{font:inherit;margin:5px;padding:8px;border-radius:7px;border:1px solid #9baac0}button{background:#e5f0ff;cursor:pointer}button:focus-visible{outline:3px solid #2364aa}.stage{padding:18px;background:#f0f5fc;border-radius:10px;min-height:110px;margin:15px 0}pre{white-space:pre-wrap;font-size:1.04rem}.muted{color:#51647a}.controls{display:flex;flex-wrap:wrap;gap:5px}.chip{display:inline-block;padding:7px 12px;margin:4px;background:#dbeafe;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left} .on{background:#ffe2a8}svg{max-width:100%}</style><main><h1>Build a parity oracle with CNOTs</h1><p>For selector s = 101, the target must become y XOR x₁ XOR x₃. Try different input bits.</p><div class="controls"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="step">Step →</button><button id="reset">↺ Reset</button></div><div id="stage" class="stage" aria-live="polite"></div><p id="explain"></p><section id="extra"></section><p class="muted">Tip: Step advances one teaching stage. Play advances automatically; Pause stops. All calculations are local to this page.</p></main><script>document.getElementById('extra').innerHTML='<label>Input x₁x₂x₃ <select id="bits"><option>110</option><option>101</option><option>011</option><option>111</option><option>000</option></select></label><label>Target y <select id="y"><option>0</option><option>1</option></select></label>';let stages=[];function update(){const b=document.getElementById('bits').value.split('').map(Number),y=+document.getElementById('y').value;stages=[{html:`<h2>Input</h2><pre>x = ${b.join('')} ; y = ${y}</pre>`,text:'The selector s=101 chooses the first and third input bits. The second bit does not affect the target.'},{html:`<h2>First CNOT (control x₁=${b[0]})</h2><pre>y₁ = ${y} XOR ${b[0]} = ${y^b[0]}</pre>`,text:'CNOT flips the target if its control is 1.'},{html:`<h2>Second CNOT (control x₃=${b[2]})</h2><pre>y₂ = ${y^b[0]} XOR ${b[2]} = ${y^b[0]^b[2]}</pre>`,text:'Now the target contains y XOR x₁ XOR x₃.'},{html:`<h2>Oracle output</h2><pre>|${b.join('')}⟩|${y^b[0]^b[2]}⟩</pre>`,text:'The input register remains unchanged; only the target has been XORed with f(x).'}];i=0;render()}document.getElementById('bits').onchange=update;document.getElementById('y').onchange=update;let i=0,timer=null;function stop(){if(timer!==null){clearInterval(timer);timer=null}}function render(){document.getElementById('stage').innerHTML=stages[i].html;document.getElementById('explain').textContent=stages[i].text}function step(){i=(i+1)%stages.length;render()}document.getElementById('play').onclick=()=>{stop();timer=setInterval(step,1900)};document.getElementById('pause').onclick=stop;document.getElementById('step').onclick=()=>{stop();step()};document.getElementById('reset').onclick=()=>{stop();i=0;render()};update();</script><script src="embed-fit.js"></script></html>
