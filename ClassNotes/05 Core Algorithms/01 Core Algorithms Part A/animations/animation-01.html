<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eigenvectors under a matrix</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:20px auto;padding:0 15px;background:#f7f9fc;color:#172238}main{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:22px}h1{font-size:1.5rem}button,select,input{font:inherit;margin:5px;padding:8px;border-radius:7px;border:1px solid #9baac0}button{background:#e5f0ff;cursor:pointer}button:focus-visible{outline:3px solid #2364aa}.stage{padding:18px;background:#f0f5fc;border-radius:10px;min-height:110px;margin:15px 0}pre{white-space:pre-wrap;font-size:1.04rem}.muted{color:#51647a}.controls{display:flex;flex-wrap:wrap;gap:5px}.chip{display:inline-block;padding:7px 12px;margin:4px;background:#dbeafe;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left} .on{background:#ffe2a8}svg{max-width:100%}</style><main><h1>Eigenvectors under a matrix</h1><p>Matrix A = [[2,1],[1,2]]. Compare special directions with an ordinary vector.</p><div class="controls"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="step">Step →</button><button id="reset">↺ Reset</button></div><div id="stage" class="stage" aria-live="polite"></div><p id="explain"></p><section id="extra"></section><p class="muted">Tip: Step advances one teaching stage. Play advances automatically; Pause stops. All calculations are local to this page.</p></main><script>const stages=[{html:'<h2>Start</h2><p>A = [[2,1],[1,2]]</p><span class="chip">v = (1,1)</span><span class="chip">w = (1,0)</span><span class="chip">q = (1,−1)</span>',text:'Choose three input arrows. A matrix can stretch and turn arrows.'},{html:'<h2>Apply A to v</h2><pre>A(1,1) = (2·1+1·1, 1·1+2·1) = (3,3) = 3v</pre>',text:'The arrow stays on the same line, so v is an eigenvector with eigenvalue 3.'},{html:'<h2>Apply A to w</h2><pre>A(1,0) = (2,1)</pre>',text:'The horizontal arrow turns upward. w is not an eigenvector.'},{html:'<h2>Apply A to q</h2><pre>A(1,−1) = (1,−1) = 1q</pre>',text:'This direction stays unchanged: eigenvalue 1.'},{html:'<h2>Scale an eigenvector</h2><pre>A(2,2) = (6,6) = 3(2,2)</pre>',text:'Every nonzero multiple of v remains an eigenvector with the same eigenvalue.'}];let i=0,timer=null;function stop(){if(timer!==null){clearInterval(timer);timer=null}}function render(){document.getElementById('stage').innerHTML=stages[i].html;document.getElementById('explain').textContent=stages[i].text}function step(){i=(i+1)%stages.length;render()}document.getElementById('play').onclick=()=>{stop();timer=setInterval(step,1900)};document.getElementById('pause').onclick=stop;document.getElementById('step').onclick=()=>{stop();step()};document.getElementById('reset').onclick=()=>{stop();i=0;render()};render();</script></html>
