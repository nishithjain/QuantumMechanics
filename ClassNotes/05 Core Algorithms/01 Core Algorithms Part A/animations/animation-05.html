<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch's algorithm: four possible functions</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:20px auto;padding:0 15px;background:#f7f9fc;color:#172238}main{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:22px}h1{font-size:1.5rem}button,select,input{font:inherit;margin:5px;padding:8px;border-radius:7px;border:1px solid #9baac0}button{background:#e5f0ff;cursor:pointer}button:focus-visible{outline:3px solid #2364aa}.stage{padding:18px;background:#f0f5fc;border-radius:10px;min-height:110px;margin:15px 0}pre{white-space:pre-wrap;font-size:1.04rem}.muted{color:#51647a}.controls{display:flex;flex-wrap:wrap;gap:5px}.chip{display:inline-block;padding:7px 12px;margin:4px;background:#dbeafe;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left} .on{background:#ffe2a8}svg{max-width:100%}</style><main><h1>Deutsch's algorithm: four possible functions</h1><p>The circuit calls U_f once. Choose f(0) and f(1), then advance through the computation.</p><div class="controls"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="step">Step →</button><button id="reset">↺ Reset</button></div><div id="stage" class="stage" aria-live="polite"></div><p id="explain"></p><section id="extra"></section><p class="muted">Tip: Step advances one teaching stage. Play advances automatically; Pause stops. All calculations are local to this page.</p></main><script>document.getElementById('extra').innerHTML='<label>f(0) <select id="f0"><option>0</option><option>1</option></select></label><label>f(1) <select id="f1"><option>0</option><option>1</option></select></label>';let stages=[];function update(){let a=+document.getElementById('f0').value,b=+document.getElementById('f1').value,signs=[a?'−':'+',b?'−':'+'],result=a^b;stages=[{html:'<h2>Initialize</h2><pre>|0⟩ ⊗ |1⟩</pre>',text:'Two qubits start in known computational basis states.'},{html:'<h2>Hadamard on both</h2><pre>|+⟩ ⊗ |−⟩</pre>',text:'The first becomes a superposition, the second becomes the phase-kickback helper.'},{html:`<h2>One oracle query</h2><pre>(${signs[0]}|0⟩ ${signs[1]}|1⟩)/√2 ⊗ |−⟩</pre>`,text:'Phase kickback attaches a sign determined by each function value. Only one call to U_f is used.'},{html:`<h2>Hadamard on first qubit</h2><pre>First qubit = ${result?'|1⟩':'|0⟩'} (up to global phase)</pre>`,text:'Equal signs interfere into |0⟩; opposite signs interfere into |1⟩.'},{html:`<h2>Measure</h2><span class="chip">${result}</span><p>${result?'BALANCED (different outputs)':'CONSTANT (same outputs)'}</p>`,text:`f(0)=${a}, f(1)=${b}; their XOR is ${result}. The measurement is certain for this promised problem.`}];i=0;render()}document.getElementById('f0').onchange=update;document.getElementById('f1').onchange=update;let i=0,timer=null;function stop(){if(timer!==null){clearInterval(timer);timer=null}}function render(){document.getElementById('stage').innerHTML=stages[i].html;document.getElementById('explain').textContent=stages[i].text}function step(){i=(i+1)%stages.length;render()}document.getElementById('play').onclick=()=>{stop();timer=setInterval(step,1900)};document.getElementById('pause').onclick=stop;document.getElementById('step').onclick=()=>{stop();step()};document.getElementById('reset').onclick=()=>{stop();i=0;render()};update();</script><script src="embed-fit.js"></script></html>
