<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 8 — Quantum oracle quiz</title>
<link rel="stylesheet" href="embed-frame.css">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    color: #202938;
    max-width: 850px;
    margin: 0 auto;
    padding: 8px 10px 10px;
    line-height: 1.55;
  }
  h1 { display: none; }
  h2 { color: #193b68; margin: 0 0 8px; }
  .intro { color: #667085; margin: 0 0 12px; font-size: 14px; }
  .lesson {
    background: white;
    padding: 14px 14px 16px;
    border-radius: 12px;
    box-shadow: 0 2px 9px rgba(0,0,0,0.06);
  }
  .question {
    border-top: 1px solid #ddd;
    padding: 16px 0;
  }
  .question:first-of-type { border-top: none; }
  h3 { font-size: 1.05rem; margin: 0 0 10px; }
  .option {
    display: block;
    padding: 9px;
    margin: 7px 0;
    background: #f4f6fa;
    border-radius: 7px;
    cursor: pointer;
  }
  .option:hover { background: #e6edfa; }
  button {
    background: #245bb5;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 7px;
    cursor: pointer;
    margin: 8px 5px 8px 0;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .feedback {
    display: none;
    padding: 12px;
    margin-top: 9px;
    border-radius: 7px;
  }
  .correct { background: #e0f5e8; color: #176b39; }
  .incorrect { background: #fde8e8; color: #a12828; }
  .score { font-size: 20px; font-weight: bold; margin-top: 18px; }
</style>
</head>
<body>
<h1>Test your understanding</h1>
<p class="intro">Lesson 8: reversible black-box function (quantum oracle)</p>
<div id="quiz" class="lesson"></div>
<script>
const lesson = {
  title: "Lesson 8 — Reversible black-box function",
  questions: [
    {
      q: "Why do we use two registers in a quantum oracle?",
      options: [
        "To duplicate the input",
        "To preserve x and update y",
        "To create two outputs"
      ],
      answer: 1,
      explanation: "The first register preserves the input x. The second register stores y XOR f(x)."
    },
    {
      q: "What is 1 XOR 1?",
      options: ["0", "1", "2"],
      answer: 0,
      explanation: "XOR produces 0 when both bits are identical."
    },
    {
      q: "Given s = 101 and x = 110, what is the binary dot product?",
      options: ["0", "1", "110"],
      answer: 1,
      explanation: "(1×1) XOR (0×1) XOR (1×0) = 1."
    },
    {
      q: "What does a CNOT gate do?",
      options: [
        "Always flips the target",
        "Flips the target only when control is 1",
        "Always sets target to zero"
      ],
      answer: 1,
      explanation: "CNOT performs target XOR control."
    },
    {
      q: "What happens when we apply the same oracle twice?",
      options: [
        "Original state is recovered",
        "Input is erased",
        "Output is doubled"
      ],
      answer: 0,
      explanation: "The same function result is XORed twice. Since b XOR b = 0, the original target is recovered."
    }
  ]
};

const root = document.getElementById("quiz");
const form = document.createElement("div");
const feedbacks = [];

lesson.questions.forEach((q, qi) => {
  const div = document.createElement("div");
  div.className = "question";
  const title = document.createElement("h3");
  title.textContent = `${qi + 1}. ${q.q}`;
  div.appendChild(title);
  q.options.forEach((option, oi) => {
    const label = document.createElement("label");
    label.className = "option";
    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = `q${qi}`;
    radio.value = oi;
    label.appendChild(radio);
    label.append(" " + option);
    div.appendChild(label);
  });
  const feedback = document.createElement("div");
  feedback.className = "feedback";
  div.appendChild(feedback);
  feedbacks.push(feedback);
  form.appendChild(div);
});

const result = document.createElement("div");
result.className = "score";
const submit = document.createElement("button");
submit.textContent = "Check answers";
const retry = document.createElement("button");
retry.textContent = "Try again";
retry.style.display = "none";

submit.onclick = () => {
  let score = 0;
  lesson.questions.forEach((q, qi) => {
    const selected = form.querySelector(`input[name="q${qi}"]:checked`);
    const feedback = feedbacks[qi];
    if (!selected) {
      feedback.className = "feedback incorrect";
      feedback.textContent = "Please answer this question.";
      feedback.style.display = "block";
      return;
    }
    const correct = Number(selected.value) === q.answer;
    if (correct) score++;
    feedback.className = "feedback " + (correct ? "correct" : "incorrect");
    feedback.textContent =
      (correct ? "Correct! " : "Incorrect. Correct answer: " + q.options[q.answer] + ". ") + q.explanation;
    feedback.style.display = "block";
  });
  result.textContent = `Your score: ${score} / ${lesson.questions.length}`;
  submit.style.display = "none";
  retry.style.display = "inline-block";
  form.querySelectorAll("input").forEach((input) => { input.disabled = true; });
  quizFit();
  setTimeout(quizFit, 80);
};

retry.onclick = () => {
  form.querySelectorAll("input").forEach((input) => {
    input.checked = false;
    input.disabled = false;
  });
  feedbacks.forEach((f) => { f.style.display = "none"; });
  result.textContent = "";
  submit.style.display = "inline-block";
  retry.style.display = "none";
  quizFit();
};

root.appendChild(form);
root.appendChild(submit);
root.appendChild(retry);
root.appendChild(result);
function quizFit() {
  if (window.qmEmbedFitSchedule) window.qmEmbedFitSchedule();
}
quizFit();
setTimeout(quizFit, 80);
</script>
<script src="embed-fit.js"></script>
</body>
</html>
