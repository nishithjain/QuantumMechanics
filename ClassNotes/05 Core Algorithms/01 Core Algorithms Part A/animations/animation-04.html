<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hadamard signs for one to three qubits</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:20px auto;padding:0 15px;background:#f7f9fc;color:#172238}main{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:22px}h1{font-size:1.5rem}button,select,input{font:inherit;margin:5px;padding:8px;border-radius:7px;border:1px solid #9baac0}button{background:#e5f0ff;cursor:pointer}button:focus-visible{outline:3px solid #2364aa}.stage{padding:18px;background:#f0f5fc;border-radius:10px;min-height:110px;margin:15px 0}pre{white-space:pre-wrap;font-size:1.04rem}.muted{color:#51647a}.controls{display:flex;flex-wrap:wrap;gap:5px}.chip{display:inline-block;padding:7px 12px;margin:4px;background:#dbeafe;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left} .on{background:#ffe2a8}svg{max-width:100%}</style><main><h1>Hadamard signs for one to three qubits</h1><p>For each output z, the sign is (−1)^(x·z), and the amplitude magnitude is 1/√(2ⁿ).</p><div class="controls"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="step">Step →</button><button id="reset">↺ Reset</button></div><div id="stage" class="stage" aria-live="polite"></div><p id="explain"></p><section id="extra"></section><p class="muted">Tip: Step advances one teaching stage. Play advances automatically; Pause stops. All calculations are local to this page.</p></main><script>document.getElementById('extra').innerHTML='<label>Input bits x <select id="bits"><option>10</option><option>110</option><option>00</option><option>01</option><option>101</option><option>0</option><option>1</option></select></label>';let stages=[];function update(){let x=document.getElementById('bits').value,n=x.length,strings=Array.from({length:2**n},(_,j)=>j.toString(2).padStart(n,'0'));let rows=strings.map(z=>{let p=0;for(let j=0;j<n;j++)p^=(+x[j])*(+z[j]);return {z,p,sign:p?'−':'+'}});stages=[{html:`<h2>Input |${x}⟩</h2><pre>n=${n}, number of output strings = ${2**n}
Every amplitude has magnitude 1/√${2**n}</pre>`,text:'Hadamard acts separately on every input qubit.'},{html:'<h2>All output terms</h2>'+rows.map(r=>`<span class="chip">|${r.z}⟩</span>`).join(''),text:'The output superposition contains every n-bit basis string.'},{html:'<h2>Parity and sign</h2><table><tr><th>z</th><th>x·z (mod 2)</th><th>Sign</th></tr>'+rows.map(r=>`<tr><td>${r.z}</td><td>${r.p}</td><td>${r.sign}</td></tr>`).join('')+'</table>',text:'Multiply matching bits of x and z, add modulo 2; odd parity gives minus.'},{html:`<h2>Final state</h2><pre>H^⊗${n}|${x}⟩ = 1/√${2**n} [${rows.map((r,j)=>(j===0?'':r.sign==='−'?' − ':' + ')+`|${r.z}⟩`).join('')}]</pre>`,text:'The normalization factor ensures that the total probability across all basis outcomes is 1.'}];i=0;render()}document.getElementById('bits').onchange=update;let i=0,timer=null;function stop(){if(timer!==null){clearInterval(timer);timer=null}}function render(){document.getElementById('stage').innerHTML=stages[i].html;document.getElementById('explain').textContent=stages[i].text}function step(){i=(i+1)%stages.length;render()}document.getElementById('play').onclick=()=>{stop();timer=setInterval(step,1900)};document.getElementById('pause').onclick=stop;document.getElementById('step').onclick=()=>{stop();step()};document.getElementById('reset').onclick=()=>{stop();i=0;render()};update();</script></html>
