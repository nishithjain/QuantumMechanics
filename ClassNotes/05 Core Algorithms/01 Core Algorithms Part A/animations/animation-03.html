<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase kickback: watch relative signs</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:20px auto;padding:0 15px;background:#f7f9fc;color:#172238}main{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:22px}h1{font-size:1.5rem}button,select,input{font:inherit;margin:5px;padding:8px;border-radius:7px;border:1px solid #9baac0}button{background:#e5f0ff;cursor:pointer}button:focus-visible{outline:3px solid #2364aa}.stage{padding:18px;background:#f0f5fc;border-radius:10px;min-height:110px;margin:15px 0}pre{white-space:pre-wrap;font-size:1.04rem}.muted{color:#51647a}.controls{display:flex;flex-wrap:wrap;gap:5px}.chip{display:inline-block;padding:7px 12px;margin:4px;background:#dbeafe;border-radius:8px}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left} .on{background:#ffe2a8}svg{max-width:100%}</style><main><h1>Phase kickback: watch relative signs</h1><p>The oracle acts on |x⟩|−⟩. Select f(0) and f(1) to see why the two input components can acquire different signs.</p><div class="controls"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="step">Step →</button><button id="reset">↺ Reset</button></div><div id="stage" class="stage" aria-live="polite"></div><p id="explain"></p><section id="extra"></section><p class="muted">Tip: Step advances one teaching stage. Play advances automatically; Pause stops. All calculations are local to this page.</p></main><script>document.getElementById('extra').innerHTML='<label>f(0) <select id="f0"><option>0</option><option>1</option></select></label><label>f(1) <select id="f1"><option>0</option><option>1</option></select></label>';let stages=[];function update(){let a=+document.getElementById('f0').value,b=+document.getElementById('f1').value;let sa=a?'−':'+',sb=b?'−':'+';stages=[{html:'<h2>Prepare registers</h2><pre>(|0⟩ + |1⟩)/√2 ⊗ (|0⟩ − |1⟩)/√2</pre>',text:'The second qubit is the minus state. The first is a superposition.'},{html:`<h2>Apply U_f once</h2><pre>(${sa}|0⟩ ${sb}|1⟩)/√2 ⊗ |−⟩</pre>`,text:'Each first-register basis component receives the sign (−1)^f(x). The minus-state register returns unchanged.'},{html:`<h2>Compare phases</h2><pre>f(0)=${a}, f(1)=${b}
Signs: ${sa} for |0⟩, ${sb} for |1⟩</pre>`,text:a===b?'The signs match. Any overall minus is a global phase; the first register is physically |+⟩.':'The signs differ. This relative phase makes the first register physically |−⟩ (up to global sign).'}, {html:`<h2>Apply H to first qubit</h2><pre>Measured first bit = ${a^b}</pre>`,text:'The final Hadamard converts the relative sign into a measurable answer.'}];i=0;render()}document.getElementById('f0').onchange=update;document.getElementById('f1').onchange=update;let i=0,timer=null;function stop(){if(timer!==null){clearInterval(timer);timer=null}}function render(){document.getElementById('stage').innerHTML=stages[i].html;document.getElementById('explain').textContent=stages[i].text}function step(){i=(i+1)%stages.length;render()}document.getElementById('play').onclick=()=>{stop();timer=setInterval(step,1900)};document.getElementById('pause').onclick=stop;document.getElementById('step').onclick=()=>{stop();step()};document.getElementById('reset').onclick=()=>{stop();i=0;render()};update();</script></html>
