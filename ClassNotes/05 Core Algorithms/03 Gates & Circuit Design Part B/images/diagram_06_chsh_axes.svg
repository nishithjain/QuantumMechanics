<text x="520.049086604272" y="330.08129888131907" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#bf651a" font-weight="700" >B₁: −22.5°</text>
<circle cx="360" cy="248" r="7" fill="#fff" stroke="#172238" stroke-width="2"/>
<rect x="670" y="112" width="328" height="260" rx="14" fill="#fff" stroke="#dce3ec" stroke-width="1.6"/>
<text x="696" y="153" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#6755dd" font-weight="700" >Input pair → axis gap</text>
<text x="693" y="201" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#172238" font-weight="400" >00:  |A₀ − B₀| = 22.5°</text>
<text x="693" y="241" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#172238" font-weight="400" >01:  |A₀ − B₁| = 22.5°</text>
<text x="693" y="281" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#172238" font-weight="400" >10:  |A₁ − B₀| = 22.5°</text>
<text x="693" y="321" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#172238" font-weight="400" >11:  |A₁ − B₁| = 67.5°</text>
<text x="50" y="445" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#6b7280" font-weight="400" >Three small gaps favor matching bits; one larger gap favors different bits.</text>
</svg>