<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="438" viewBox="0 0 1230 438" role="img" aria-labelledby="title desc"><title id="title">Deferred measurement coherent teleportation</title><desc id="desc">Three-wire coherent teleportation circuit prepares Bell pair, Alice does CNOT H, Bob corrected by quantum controlled CNOT and CZ without intermediate measurement</desc>
