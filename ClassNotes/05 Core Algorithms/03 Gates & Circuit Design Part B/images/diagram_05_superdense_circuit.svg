<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="442" viewBox="0 0 1240 442" role="img" aria-labelledby="title desc"><title id="title">Superdense coding circuit</title><desc id="desc">Shared Bell pair, Alice applies message-dependent X and Z to her half and sends that qubit to Bob, then Bob decodes with CNOT and Hadamard</desc>
<rect width="1240" height="442" fill="#f7f9fc"/>
<text x="40" y="44" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#6755dd" font-weight="700" >SUPERDENSE CODING: TWO CLASSICAL BITS VIA ONE SENT QUBIT</text>
<line x1="145" y1="145" x2="1198" y2="145" stroke="#8ca1b5" stroke-width="3" stroke-linecap="round"/>
<text x="25" y="151" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#172238" font-weight="700" >Alice |0⟩</text>
<line x1="145" y1="248" x2="1198" y2="248" stroke="#8ca1b5" stroke-width="3" stroke-linecap="round"/>
<text x="25" y="254" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#172238" font-weight="700" >Bob   |0⟩</text>
<rect x="201.0" y="117" width="54" height="56" rx="9" fill="#fff" stroke="#6755dd" stroke-width="2.8"/>
<text x="228" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#6755dd" font-weight="700" >H</text>
<circle cx="305" cy="145" r="8" fill="#6755dd" stroke="#6755dd" stroke-width="3"/>
<line x1="305" y1="145" x2="305" y2="248" stroke="#6755dd" stroke-width="3" stroke-linecap="round"/>
<circle cx="305" cy="248" r="22" fill="#fff" stroke="#6755dd" stroke-width="2.5"/>
<line x1="290" y1="248" x2="320" y2="248" stroke="#6755dd" stroke-width="2.5" stroke-linecap="round"/>
<line x1="305" y1="233" x2="305" y2="263" stroke="#6755dd" stroke-width="2.5" stroke-linecap="round"/>
<text x="274" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#6755dd" font-weight="700" >Share Φ+</text>
<rect x="410.0" y="117" width="54" height="56" rx="9" fill="#fff" stroke="#bf651a" stroke-width="2.8"/>
<text x="437" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#bf651a" font-weight="700" >X</text>
<rect x="496.0" y="117" width="54" height="56" rx="9" fill="#fff" stroke="#bf651a" stroke-width="2.8"/>
<text x="523" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#bf651a" font-weight="700" >Z</text>
<text x="477" y="97" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#bf651a" font-weight="700" >Encode m₁m₀</text>
<line x1="644" y1="87" x2="644" y2="292" stroke="#087f77" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>
<text x="644" y="324" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#087f77" font-weight="700" >Send Alice’s qubit → Bob</text>
<circle cx="770" cy="145" r="8" fill="#6755dd" stroke="#6755dd" stroke-width="3"/>
<line x1="770" y1="145" x2="770" y2="248" stroke="#6755dd" stroke-width="3" stroke-linecap="round"/>
<circle cx="770" cy="248" r="22" fill="#fff" stroke="#6755dd" stroke-width="2.5"/>
<line x1="755" y1="248" x2="785" y2="248" stroke="#6755dd" stroke-width="2.5" stroke-linecap="round"/>
<line x1="770" y1="233" x2="770" y2="263" stroke="#6755dd" stroke-width="2.5" stroke-linecap="round"/>
<rect x="824.0" y="117" width="54" height="56" rx="9" fill="#fff" stroke="#6755dd" stroke-width="2.8"/>
<text x="851" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#6755dd" font-weight="700" >H</text>
<rect x="933.0" y="117" width="54" height="56" rx="9" fill="#fff" stroke="#087f77" stroke-width="2.8"/>
<text x="960" y="154" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#087f77" font-weight="700" >M</text>
<rect x="933.0" y="220" width="54" height="56" rx="9" fill="#fff" stroke="#087f77" stroke-width="2.8"/>
<text x="960" y="257" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#087f77" font-weight="700" >M</text>
<text x="837" y="97" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#6755dd" font-weight="700" >Decode Bell state</text>
<text x="1011" y="145" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#172238" font-weight="700" >Top: m₀</text>
<text x="1011" y="250" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#172238" font-weight="700" >Bottom: m₁</text>
<rect x="40" y="357" width="1160" height="56" rx="14" fill="#fff" stroke="#dce3ec" stroke-width="1.6"/>
<text x="70" y="391" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#172238" font-weight="700" >00 → Φ+    •    01 → Φ−    •    10 → Ψ+    •    11 → Ψ−   (message order: m₁ m₀)</text>
</svg>