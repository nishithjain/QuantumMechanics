<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="ax" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
<marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c1121f"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2d6a4f"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d4e89"/></marker>
</defs>
<rect width="720" height="430" fill="#fafafa"/>

<text x="360" y="30" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">Ket |&#968;&#10217; as a column vector in &#8450;&#178;</text>
<text x="360" y="52" font-size="12.5" fill="#555" text-anchor="middle">Real cartoon in &#8477;&#178;: &#945; and &#946; are coordinates in the orthonormal computational basis {|0&#10217;, |1&#10217;}</text>

<!-- light grid -->
<g stroke="#e8e8e8" stroke-width="1">
<line x1="80" y1="120" x2="520" y2="120"/><line x1="80" y1="170" x2="520" y2="170"/>
<line x1="80" y1="220" x2="520" y2="220"/><line x1="80" y1="270" x2="520" y2="270"/>
<line x1="130" y1="90" x2="130" y2="310"/><line x1="180" y1="90" x2="180" y2="310"/>
<line x1="230" y1="90" x2="230" y2="310"/><line x1="280" y1="90" x2="280" y2="310"/>
<line x1="330" y1="90" x2="330" y2="310"/><line x1="380" y1="90" x2="380" y2="310"/>
<line x1="430" y1="90" x2="430" y2="310"/><line x1="480" y1="90" x2="480" y2="310"/>
</g>

<!-- origin O, tip psi: alpha=240px, beta=150px -->
<!-- O=(100,300)  psi=(340,150)  A=(340,300)  B=(100,150) -->

<line x1="100" y1="300" x2="500" y2="300" stroke="#555" stroke-width="1.6" marker-end="url(#ax)"/>
<line x1="100" y1="300" x2="100" y2="95" stroke="#555" stroke-width="1.6" marker-end="url(#ax)"/>
<text x="505" y="304" font-size="12" fill="#555">|0&#10217; direction</text>
<text x="108" y="92" font-size="12" fill="#555">|1&#10217; direction</text>

<polygon points="100,300 340,300 340,150 100,150" fill="#d8e8f8" fill-opacity="0.75"/>

<!-- alpha along |0> -->
<line x1="100" y1="300" x2="340" y2="300" stroke="#c1121f" stroke-width="3.2" marker-end="url(#r)"/>
<text x="220" y="318" font-size="15" fill="#c1121f" text-anchor="middle" font-weight="bold">&#945; |0&#10217;</text>

<!-- beta along |1> -->
<line x1="100" y1="300" x2="100" y2="150" stroke="#2d6a4f" stroke-width="3.2" marker-end="url(#g)"/>
<text x="88" y="228" font-size="15" fill="#2d6a4f" text-anchor="end" font-weight="bold">&#946; |1&#10217;</text>

<!-- tip-to-tip dashed (same components) -->
<line x1="340" y1="300" x2="340" y2="150" stroke="#2d6a4f" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.85"/>
<line x1="100" y1="150" x2="340" y2="150" stroke="#c1121f" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.85"/>

<!-- |psi> -->
<line x1="100" y1="300" x2="340" y2="150" stroke="#1d4e89" stroke-width="3.4" marker-end="url(#b)"/>
<circle cx="340" cy="150" r="5" fill="#1d4e89"/>
<circle cx="100" cy="300" r="4" fill="#333"/>
<text x="352" y="146" font-size="16" fill="#1d4e89" font-weight="bold">|&#968;&#10217;</text>

<!-- column vector box -->
<g transform="translate(530,115)">
<rect x="0" y="0" width="155" height="118" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.2"/>
<text x="77" y="26" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">same state</text>
<text x="77" y="52" font-size="14" fill="#1d4e89" text-anchor="middle" font-weight="bold">|&#968;&#10217;</text>
<text x="77" y="78" font-size="13" fill="#333" text-anchor="middle">=</text>
<text x="77" y="104" font-size="22" fill="#333" text-anchor="middle" font-family="Times New Roman, serif">( &#945; , &#946; )</text>
</g>
<text x="607" y="248" font-size="11" fill="#555" text-anchor="middle">column in &#8450;&#178;</text>

<text x="360" y="358" font-size="15" fill="#1d4e89" text-anchor="middle" font-weight="bold">|&#968;&#10217; = &#945;|0&#10217; + &#946;|1&#10217;</text>
<text x="360" y="382" font-size="12" fill="#666" text-anchor="middle">&#945; and &#946; are complex amplitudes (probabilities use |&#945;|&#178; and |&#946;|&#178;). Lengths here are real numbers for clarity only.</text>
</svg>
