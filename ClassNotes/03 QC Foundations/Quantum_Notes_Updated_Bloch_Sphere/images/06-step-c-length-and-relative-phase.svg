<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="Arial, Helvetica, sans-serif">
<defs>
<marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
<marker id="ao" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c2410c"/></marker>
<marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
</defs>
<rect width="780" height="460" fill="#fafbfd"/>
<text x="390" y="28" font-size="17" fill="#17243b" text-anchor="middle" font-weight="bold">Step C: two independent numbers after normalization and global phase</text>
<text x="390" y="50" font-size="12.5" fill="#52617a" text-anchor="middle">Representative form: first amplitude real on the axis; second carries relative phase phi</text>

<g transform="translate(130, 95)">
<text x="250" y="12" font-size="14" fill="#17243b" text-anchor="middle" font-weight="bold">Complex plane (one arrow per amplitude)</text>
<circle cx="250" cy="200" r="118" fill="none" stroke="#d0d9e8" stroke-width="2"/>
<line x1="90" y1="200" x2="410" y2="200" stroke="#888" stroke-width="1.4" marker-end="url(#ag)"/>
<line x1="250" y1="320" x2="250" y2="72" stroke="#888" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="418" y="204" font-size="12" fill="#555">Re</text>
<text x="258" y="68" font-size="12" fill="#555">Im</text>

<line x1="250" y1="200" x2="320.8" y2="200" stroke="#2563eb" stroke-width="3.5" marker-end="url(#ab)"/>
<text x="328" y="196" font-size="14" fill="#2563eb" font-weight="bold">alpha = r0</text>
<text x="285" y="218" font-size="12" fill="#2563eb">length r0 (e.g. 0.6)</text>

<line x1="250" y1="200" x2="250" y2="105.6" stroke="#c2410c" stroke-width="3.5" marker-end="url(#ao)"/>
<text x="258" y="98" font-size="14" fill="#c2410c" font-weight="bold">beta = r1 e^(i phi)</text>
<text x="268" y="148" font-size="12" fill="#c2410c">length r1 = sqrt(1 - r0^2)</text>

<path d="M 278 200 A 28 28 0 0 0 278 172" fill="none" stroke="#395cd8" stroke-width="2"/>
<text x="302" y="182" font-size="13" fill="#395cd8" font-weight="bold">phi</text>
<text x="250" y="348" font-size="12" fill="#52617a" text-anchor="middle">phi = phase of beta relative to alpha (example: 90 degrees)</text>
</g>

<g transform="translate(470, 88)">
<rect x="0" y="0" width="270" height="300" rx="12" fill="#fff" stroke="#d7e0ed" stroke-width="1.2"/>
<text x="135" y="28" font-size="14" fill="#17243b" text-anchor="middle" font-weight="bold">What you can choose freely</text>

<rect x="18" y="48" width="234" height="88" rx="8" fill="#edf2ff" stroke="#c7d4f0"/>
<text x="135" y="72" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">1. One length</text>
<text x="135" y="94" font-size="12" fill="#17243b" text-anchor="middle">Pick r0 (size of first amplitude).</text>
<text x="135" y="114" font-size="12" fill="#17243b" text-anchor="middle">Normalization fixes r1.</text>
<text x="135" y="128" font-size="11" fill="#52617a" text-anchor="middle">P(0)=r0^2,  P(1)=r1^2</text>

<rect x="18" y="148" width="234" height="88" rx="8" fill="#fff4ed" stroke="#f0d4b8"/>
<text x="135" y="172" font-size="13" fill="#c2410c" text-anchor="middle" font-weight="bold">2. One angle</text>
<text x="135" y="194" font-size="12" fill="#17243b" text-anchor="middle">Relative phase phi between the</text>
<text x="135" y="212" font-size="12" fill="#17243b" text-anchor="middle">two amplitude arrows.</text>

<rect x="18" y="248" width="234" height="42" rx="6" fill="#f3f4f6" stroke="#ddd"/>
<text x="135" y="274" font-size="11.5" fill="#52617a" text-anchor="middle">Not two separate gamma0 and gamma1 - only gap phi</text>
</g>

<text x="390" y="430" font-size="13" fill="#17243b" text-anchor="middle" font-weight="bold">|psi&gt; = r0|0&gt; + r1 e^(i phi)|1&gt;,   with  r0^2 + r1^2 = 1</text>
<text x="390" y="452" font-size="11" fill="#777" text-anchor="middle">Step D later replaces r0, r1 by cos(theta/2), sin(theta/2).</text>
</svg>
